function hmBreath(on){ const f=document.getElementById('hmFire'); if(f) f.classList.toggle('on', !!on); }
// ---- the readout: shape progress cross-fades the three renders, heat drives glow and colour ----
const hmRamp=(v,a,b)=>Math.max(0, Math.min(1, (v-a)/(b-a)));
function hmRender(){
    const orb=document.getElementById('hmOrb'), rough=document.getElementById('hmRough'),
          fin=document.getElementById('hmFinal'), mo=document.getElementById('hmMorph'), R=HM_RIG;
    if(!orb) return;
    const t1=Math.min(1,hmProg), t2=Math.max(0,Math.min(1,hmProg-1));
    // Each shape change is a SHORT, complementary fade (the two alphas always sum to 1) rather than a
    // fade spread over the whole stage — the metal spends most of its time looking solid.
    const k1=hmRamp(t1,0.34,0.62), k2=hmRamp(t2,0.34,0.62);
    orb.style.opacity=(1-k1).toFixed(3);
    rough.style.opacity=(k1*(1-k2)).toFixed(3);
    fin.style.opacity=k2.toFixed(3);
    // geometry carries the rest of the read: the sphere is flattened out, and the blade is drawn to length
    orb.style.transform='translate(-50%,-50%) scale('+(1-0.34*t1).toFixed(3)+','+(1-0.62*t1).toFixed(3)+')';
    rough.style.transform='translate(-50%,-50%) rotate('+R.roughRot+'deg) scale('+(0.66+0.34*hmRamp(t1,0.30,0.92)).toFixed(3)+')';
    const bloom=Math.max(k1*(1-k1), k2*(1-k2))*1.7;   // peaks mid-swap, zero at either end
    mo.style.opacity=bloom.toFixed(3);
    // ---- heat ----
    const g=hmHeat;
    orb.querySelector('.hot').style.opacity=g.toFixed(3);
    orb.style.filter='brightness('+(1+0.30*g).toFixed(2)+')'+
        (g>0.02 ? ' drop-shadow(0 0 '+Math.round(10+42*g)+'px rgba(255,150,50,'+(0.85*g).toFixed(2)+'))' : '');
    // The blade sprites are painted warm, so cold metal has to be actively drained of colour and light —
    // otherwise a stone-cold blade still looks hot and the player has no way to tell it needs reheating.
    const metal='brightness('+(0.70+0.90*g).toFixed(2)+') saturate('+(0.30+0.85*g).toFixed(2)+')'+
        (g>0.02 ? ' drop-shadow(0 0 '+Math.round(4+34*g)+'px rgba(255,205,115,'+(0.9*g).toFixed(2)+'))' : '');
    rough.style.filter=metal; fin.style.filter=metal;
}
function hmSay(){
    const el=document.getElementById('hmSay'); if(!el) return;
    el.innerHTML = hmProg>=2 ? 'Blade shaped.'
        : hmHeat>=HM_FORGE.workMin ? 'It glows &mdash; <b>strike</b> it: swing the hammer onto the anvil'
        : 'Hold the <b>dragon&rsquo;s head</b> so its fire falls on the metal';
}
// ---- is the flame actually landing on the workpiece? ----
function hmFireOnWork(){
    if(!document.getElementById('hmFire').classList.contains('on')) return false;
    const sc=document.getElementById('hmScene').getBoundingClientRect();
    const mid=id=>{ const r=document.getElementById(id).getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2 }; };
    const s=mid('hmSnout'), a=mid('hmAim');
    const w={ x:sc.left+sc.width*HM_RIG.anvil.x/100, y:sc.top+sc.height*HM_RIG.anvil.y/100 };
    const dx=w.x-s.x, dy=w.y-s.y;
    if(Math.hypot(dx,dy) > sc.width*HM_FORGE.reach) return false;
    let off=(Math.atan2(dy,dx)-Math.atan2(a.y-s.y,a.x-s.x))*180/Math.PI;
    while(off>180) off-=360; while(off<-180) off+=360;
    return Math.abs(off) <= HM_FORGE.cone;
}
function hmStart(){ if(hmRaf) return; hmLast=0; hmRaf=requestAnimationFrame(hmTick); }
function hmStop(){ if(hmRaf) cancelAnimationFrame(hmRaf); hmRaf=null; }
function hmTick(ts){
    hmRaf=requestAnimationFrame(hmTick);
    const dt=hmLast ? Math.min(0.1,(ts-hmLast)/1000) : 0; hmLast=ts;
    const F=HM_FORGE, was=hmHeat;
    if(hmFireOnWork()) hmHeat=Math.min(1, hmHeat+F.heatGain*dt);
    hmHeat=Math.max(0, hmHeat-F.heatCool*dt);
    if(Math.abs(hmHeat-was)>0.0004){ hmRender(); if((was<F.workMin)!==(hmHeat<F.workMin)) hmSay(); }
}
// ---- a strike ----
function hmJolt(cls){ const w=document.getElementById('hmWork'); w.classList.remove('jolt','chill'); void w.offsetWidth; w.classList.add(cls); }
// A hot blow gets the full treatment — white flash, shock ring, a shower of arcing sparks. A cold blow
// gets a few dull grey chips and nothing else, so the two read differently without any text.
function hmImpact(hot){
    const layer=document.getElementById('hmFx'), R=HM_RIG;
    const add=(cls,life,style)=>{ const d=document.createElement('div'); d.className=cls;
        d.style.left=R.anvil.x+'%'; d.style.top=(R.anvil.y-2)+'%';
        Object.assign(d.style, style||{}); layer.appendChild(d); setTimeout(()=>d.remove(),life); return d; };
    if(hot){ add('hm-flash',330); add('hm-ring',460); }
    const n = hot ? 22 : 6;
    for(let i=0;i<n;i++){
        const px = hot ? 3+Math.random()*5 : 2+Math.random()*2;
        const d=add('hm-spark',1000,{ width:px.toFixed(1)+'px', height:px.toFixed(1)+'px' });
        d.style.background = hot ? 'radial-gradient(circle,#fffdf2,#ffb347)' : 'radial-gradient(circle,#c9cfd6,#7d858e)';
        if(hot) d.style.boxShadow='0 0 '+Math.round(4+px)+'px '+(px/3).toFixed(1)+'px rgba(255,170,60,.85)';
        d.style.setProperty('--sx', Math.round((Math.random()*2-1)*(hot?210:70))+'px');
        d.style.setProperty('--sy', Math.round(-(hot?30:14)-Math.random()*(hot?120:45))+'px');
        d.style.setProperty('--sf', Math.round((hot?70:26)+Math.random()*(hot?90:30))+'px');   // gravity on the way out
        d.style.setProperty('--sd', (0.42+Math.random()*(hot?0.42:0.18)).toFixed(2)+'s');
        d.style.animationDelay=Math.round(Math.random()*(hot?90:40))+'ms';
    }
}
function hmStrike(){
    const now=performance.now(); if(now-hmLastStrike<HM_FORGE.strikeGap) return; hmLastStrike=now;
    const h=document.getElementById('hmHammer');
    h.classList.remove('hit'); void h.offsetWidth;   // restart the swing even on a fast second blow
    h.classList.add('hit'); setTimeout(()=>h.classList.remove('hit'),240);
    if(hmProg>=2) return;
    if(hmHeat<HM_FORGE.workMin){ hmJolt('chill'); hmImpact(false); return; }   // too cold to move
    hmHeat=Math.max(0, hmHeat-HM_FORGE.strikeBite);
    hmProg=Math.min(2, hmProg+HM_FORGE.strikeGain);
    hmJolt('jolt'); hmImpact(true); hmRender(); hmSay();
    if(hmProg>=2) setTimeout(()=>{ if(document.getElementById('sfHammerModal').classList.contains('show')) finishBlade(); }, 1700);
}
// ---- input ----
// Drag the head: track the CHANGE in pointer angle about the pivot rather than the absolute angle, so
// the head never jumps to meet the cursor wherever you grab it. Holding = breathing.
function wireHmDragon(){
    const wrap=document.getElementById('hmDragon'), pad=document.getElementById('hmHead'), sc=document.getElementById('hmScene');
    if(!pad||!sc) return;
    const pivotPx=()=>{ const r=sc.getBoundingClientRect(); return { x:r.left+r.width*HM_RIG.pivot.x/100, y:r.top+r.height*HM_RIG.pivot.y/100 }; };
    const ang=(e,p)=>Math.atan2(e.clientY-p.y, e.clientX-p.x)*180/Math.PI;
    let live=false, a0=0, s0=0;
    pad.addEventListener('pointerdown', e=>{ live=true; a0=ang(e,pivotPx()); s0=hmAngle; wrap.classList.add('grabbing'); hmBreath(true); try{ pad.setPointerCapture(e.pointerId); }catch(err){} e.preventDefault(); });
    pad.addEventListener('pointermove', e=>{ if(!live) return; hmAimDragon(s0 + (ang(e,pivotPx())-a0)); });
    const end=()=>{ live=false; wrap.classList.remove('grabbing'); hmBreath(false); };
    pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
}
// Drag the hammer. The sprite is a full-canvas layer, so a transparent grip pad carries the pointer
// events and the layer itself is only translated (--hx/--hy, which the hover animation also reads).
// A strike fires when the head ENTERS the anvil zone, so lifting and dropping repeatedly is the
// hammering motion — one slow sweep across the anvil is a single blow, not a burst.
function wireHmHammer(){
    const h=document.getElementById('hmHammer'), grip=document.getElementById('hmGrip'), sc=document.getElementById('hmScene');
    if(!h||!grip||!sc) return;
    let live=false, px=0, py=0, x=0, y=0, wasIn=false;
    const inZone=()=>{ const r=sc.getBoundingClientRect();
        const hx=r.width*0.77+x, hy=r.height*0.30+y;   // hammer head, in stage px, plus the drag offset
        return Math.hypot(hx-r.width*HM_RIG.anvil.x/100, hy-r.height*HM_RIG.anvil.y/100) < r.width*0.16; };
    const paint=()=>{ h.style.setProperty('--hx',x+'px'); h.style.setProperty('--hy',y+'px');
        grip.style.transform='translate('+x+'px,'+y+'px)';
        const now=inZone(); h.classList.toggle('striking', now);
        if(now && !wasIn && live) hmStrike(); wasIn=now; };
    grip.addEventListener('pointerdown', e=>{ live=true; px=e.clientX-x; py=e.clientY-y; h.classList.add('dragging'); grip.classList.add('dragging'); try{ grip.setPointerCapture(e.pointerId); }catch(err){} e.preventDefault(); });
    grip.addEventListener('pointermove', e=>{ if(!live) return; const r=sc.getBoundingClientRect();
        x=Math.max(-r.width*0.55, Math.min(r.width*0.16, e.clientX-px));
        y=Math.max(-r.height*0.10, Math.min(r.height*0.55, e.clientY-py)); paint(); });
    const end=()=>{ live=false; h.classList.remove('dragging'); grip.classList.remove('dragging'); paint(); };
    grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
    paint();
}

// --- camera follow ---
function ensureSwordVisible(){ const mx=0.18,myTop=0.14,myBot=0.62,vw=view.w,vh=vw*aspect; let nx=view.x,ny=view.y; if(marker.x<view.x+vw*mx) nx=marker.x-vw*mx; else if(marker.x>view.x+vw*(1-mx)) nx=marker.x-vw*(1-mx); if(marker.y<view.y+vh*myTop) ny=marker.y-vh*myTop; else if(marker.y>view.y+vh*myBot) ny=marker.y-vh*myBot; if(nx!==view.x||ny!==view.y){ view.x=nx; view.y=ny; setView(); } }

// --- sword travel across the stacked route ---
function advanceSword(dt){ if(!segs.length || !melt) return; let step=SWORD_SPEED*Math.max(CRAWL_MIN, melt.heat/100)*dt, guard=0;   // at heat 0 the sword still creeps at CRAWL_MIN× speed
    while(step>0 && sword.seg<segs.length && guard++<60){ const s=segs[sword.seg]; if(sword.frac<s.tPct){ const room=s.tPct-sword.frac; if(step<room){ sword.frac+=step; step=0; } else { step-=room; sword.frac=s.tPct; if(sword.seg<segs.length-1){ sword.seg++; sword.frac=0; } else break; } } else if(sword.seg<segs.length-1){ sword.seg++; sword.frac=0; } else break; }
    const p=swordPoint(); setSword(p.x,p.y); reveal(p.x,p.y,'sword'); drawRoute(); ensureSwordVisible(); checkTraitReach(p); checkHazard(p,dt); checkBooks(p); }   // drawRoute() erases the part behind the sword

// --- main loop ---
let lastT=0;
function tick(now){
    const dt = lastT ? Math.min(0.05,(now-lastT)/1000) : 0; lastT=now;
    if(pestleGrinding && prep){ prep.grind=Math.min(1,prep.grind+GRIND_RATE*dt); updateOrbLook(); drawPrepPreview();
        fxAcc.grind+=dt; if(fxAcc.grind>0.05){ fxAcc.grind=0; const g=fxPt(document.querySelector('#stMortar .mortar'),0.52,0.30); fxBurst(g.x,g.y,{n:3,kind:'spark',ang:-0.35,spread:1.1,dist:26,size:3.5,dur:340}); } }
    if(melt && melt.stage==='smelting'){ if(bellowing){ melt.heat=Math.min(100,melt.heat+HEAT_RISE*dt);
            fxAcc.bellow+=dt; if(fxAcc.bellow>0.13){ fxAcc.bellow=0; const m=fxPt(document.querySelector('#stSmelt .furnace'),0.5,0.60); fxBurst(m.x,m.y,{n:3,kind:'ember',ang:-Math.PI/2,spread:0.85,dist:42,size:5,dur:660}); } }
        if(!gateReady && (now-melt.smeltT0)/1000>=SMELT_TIME) markGateReady(); updateGauges(); }
    if(melt && (melt.stage==='hot'||melt.stage==='onAnvil') && melt.heat>0){ melt.heat=Math.max(0, melt.heat-HEAT_DECAY*dt); updateGauges(); }   // heat (=speed) cools once the orb is out of the smelter
    const fireOnAnvil = dragonBreathing && fireHitsAnvil();
    if(dragonBreathing){ fxAcc.fire+=dt; if(fxAcc.fire>0.08){ fxAcc.fire=0; const f=document.getElementById('dragonFire'); if(f&&f.style.display!=='none'){ const bb=benchEl().getBoundingClientRect(), fr=f.getBoundingClientRect(); fxBurst(fr.right-bb.left-6, fr.top+fr.height*0.5-bb.top, {n:2,kind:'ember',ang:0.1,spread:0.7,dist:28,size:4,dur:520}); } } }
    if(fireOnAnvil && segs.length){   // fire on the anvil PULLS the sword + its remaining path + ✕ toward the centre — gradual & controlled (only while it burns)
        const p=swordPoint(), dx=START.x-p.x, dy=START.y-p.y, dist=Math.hypot(dx,dy);
        if(dist>3){ if(!retreating){ retreating=true; hint('The dragon\'s fire pulls the sword &amp; its path toward the centre — hold to pull more, release to stop.'); }
            const step=Math.min(dist, PULL_SPEED*dt); pull.x+=dx/dist*step; pull.y+=dy/dist*step;
            const np=swordPoint(); setSword(np.x,np.y); drawRoute(); moveX(); reveal(np.x,np.y,'sword'); checkTraitReach(np); checkHazard(np,dt); checkBooks(np); }
    } else {
        if(retreating) retreating=false;
        if(melt && melt.stage==='onAnvil' && !melt.acquiredTrait && hammerStriking()){ advanceSword(dt);   // hammer never fights the fire
            fxAcc.strike+=dt; if(fxAcc.strike>0.28){ fxAcc.strike=0; const a=fxPt(stAnvil,0.5,0.16); fxBurst(a.x,a.y,{n:5,spread:1.8,dist:32,size:4.5,dur:420}); const av=document.querySelector('#stAnvil .anvil'); if(av){ av.classList.remove('recoil'); void av.offsetWidth; av.classList.add('recoil'); } } }
    }
    requestAnimationFrame(tick);
}

// --- wiring ---
const ORE_COUNT={ iron:100, manganese:12, copper:100, aluminium:5, nickel:8, tin:33, zinc:18 };   // decorative rail counts (anchor-style xNN)
const MAT_CELLS=12;   // r20: the reference inventory is a 3x4 grid. All 8 ORES are shown and the remainder are EMPTY cells - the old RAIL_FILLER invented duplicate materials, which a real inventory should not do. (non-interactive)
function wireOreTray(){ const shelf=document.getElementById('oreShelf'); shelf.querySelectorAll('.ore-slot').forEach(s=>s.remove());   // build one slot per ore in ORES (so adding ores needs no HTML change)
    ORES.forEach(o=>{ const slot=document.createElement('div'); slot.className='ore-slot'; slot.style.cursor='grab'; slot.innerHTML='<img src="'+o.img+'" alt="'+o.name+'"><span>'+o.name+'</span><span class="ore-count">x'+(ORE_COUNT[o.id]||99)+'</span>';
        slot.addEventListener('pointerdown', e=>{ if(!canAddOre()){ hint('Put the orb back in the furnace before adding more ore.'); return; } startOreDrag(o.id, e); }); shelf.appendChild(slot); });
    for(let i=ORES.length;i<MAT_CELLS;i++){ const slot=document.createElement('div'); slot.className='ore-slot empty'; shelf.appendChild(slot); } }
function startOreDrag(oreId,e){ e.preventDefault(); const bench=benchEl(), b=bench.getBoundingClientRect(); const ghost=document.createElement('img'); ghost.src=oreImg(oreId); ghost.style.cssText='position:absolute;width:46px;height:46px;object-fit:contain;z-index:25;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));'; bench.appendChild(ghost); drawSegmentPreview(oreId,0.5); const move=ev=>{ ghost.style.left=(ev.clientX-b.left)+'px'; ghost.style.top=(ev.clientY-b.top-dragLift(ev))+'px'; }; move(e); const up=ev=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); ghost.remove(); hidePreviewPaths(); const c={x:ev.clientX-b.left,y:ev.clientY-b.top-dragLift(ev)}; if(canAddOre()&&overTarget(c,'mortar')){ startPrep(oreId); return; } if(canAddOre()&&overTarget(c,'furnaceTop')){ addOreDirect(oreId); return; } if(segs.length) moveX(); else xmark.style.display='none'; }; document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); }

function wirePestle(){ const p=document.getElementById('pestle'), bench=benchEl(); let drag=false,dx,dy; const over=()=>{ const m=stMortar.getBoundingClientRect(), pr=p.getBoundingClientRect(); const px=pr.left+pr.width*0.5, py=pr.bottom-14; return px>m.left&&px<m.right&&py>m.top-6&&py<m.bottom+24; }; p.addEventListener('pointerdown',e=>{ drag=true; const r=p.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; try{p.setPointerCapture(e.pointerId);}catch(err){} pestleGrinding=over()&&!!prep; p.classList.toggle('pounding',pestleGrinding); }); p.addEventListener('pointermove',e=>{ if(!drag) return; const b=bench.getBoundingClientRect(); let x=e.clientX-b.left-dx, y=e.clientY-b.top-dy-dragLift(e); x=Math.max(-30,Math.min(b.width-p.offsetWidth+30,x)); y=Math.max(-30,Math.min(b.height-p.offsetHeight+20,y)); p.style.left=x+'px'; p.style.top=y+'px'; p.style.right='auto'; const g=over()&&!!prep; pestleGrinding=g; p.classList.toggle('pounding',g); }); const end=()=>{ drag=false; pestleGrinding=false; p.classList.remove('pounding'); }; p.addEventListener('pointerup',end); p.addEventListener('pointercancel',end); }

function wireDragon(){ const d=document.getElementById('dragon'), bench=benchEl(); let active=false,sx,sy,dx,dy,mode; d.addEventListener('pointerdown',e=>{ active=true; mode='breath'; sx=e.clientX; sy=e.clientY; const r=d.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; try{d.setPointerCapture(e.pointerId);}catch(err){} startBreath(); }); d.addEventListener('pointermove',e=>{ if(!active) return; if(mode==='breath'&&Math.hypot(e.clientX-sx,e.clientY-sy)>7){ mode='drag'; stopBreath(); d.classList.add('dragging'); } if(mode==='drag'){ const b=bench.getBoundingClientRect(); let x=e.clientX-b.left-dx, y=e.clientY-b.top-dy-dragLift(e); const q=dragBox(d,b,30); x=Math.max(q.x0,Math.min(q.x1,x)); y=Math.max(q.y0,Math.min(q.y1,y)); /* r22: frame-wide bounds; wireDragon is the LIVE dragon handler (makeDraggable/wireMovable are dead code) */ d.style.left=x+'px'; d.style.top=y+'px'; d.style.right='auto'; } updateFirePos(); }); const end=()=>{ active=false; mode=null; stopBreath(); d.classList.remove('dragging'); }; d.addEventListener('pointerup',end); d.addEventListener('pointercancel',end); }

function wireBellowGate(){ const bh=document.getElementById('bellowHot'), gate=document.getElementById('furnaceGate'), top=document.getElementById('bellowtop'); const startB=e=>{ e.preventDefault(); if(melt&&melt.stage==='smelting'){ bellowing=true; top.classList.add('pumping'); } }; const stopB=()=>{ bellowing=false; top.classList.remove('pumping'); }; bh.addEventListener('pointerdown',startB); bh.addEventListener('pointerup',stopB); bh.addEventListener('pointercancel',stopB); bh.addEventListener('pointerleave',stopB); gate.addEventListener('pointerdown',e=>{ e.preventDefault(); openGate(); }); }

// ---- JUICE: particle bursts + interactive grind wheel (Phase B station feel) ----
let fxAcc={grind:0,bellow:0,fire:0,strike:0};
function fxPt(el,fx,fy){ const b=benchEl().getBoundingClientRect(), r=el.getBoundingClientRect(); return {x:r.left+r.width*fx-b.left, y:r.top+r.height*fy-b.top}; }
function fxBurst(x,y,o){ o=o||{}; const b=benchEl(), n=o.n||8, kind=o.kind||'spark', base=(o.ang!=null?o.ang:-Math.PI/2), spread=(o.spread!=null?o.spread:Math.PI*0.8);
    for(let i=0;i<n;i++){ const a=base+(Math.random()-0.5)*spread, dist=(o.dist||34)*(0.5+Math.random()), dxp=Math.cos(a)*dist, dyp=Math.sin(a)*dist, sz=(o.size||5)*(0.6+Math.random()*0.8);
        let bg='radial-gradient(circle at 40% 35%,#fff,#ffb733 55%,#ff7a1a 82%)', glow='rgba(255,140,30,.8)';
        if(kind==='ember'){ bg='radial-gradient(circle,#ffe6a8,#ff7a1a 72%)'; }
        if(kind==='steam'){ bg='radial-gradient(circle,rgba(242,247,255,.92),rgba(200,215,235,.12) 76%)'; glow='rgba(200,215,235,.5)'; }
        const p=document.createElement('div'); p.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:'+sz.toFixed(1)+'px;height:'+sz.toFixed(1)+'px;border-radius:50%;z-index:28;pointer-events:none;background:'+bg+';filter:drop-shadow(0 0 3px '+glow+');';
        b.appendChild(p); const dur=(o.dur||520)*(0.7+Math.random()*0.6), endS=(kind==='steam'?1.9:0.3), lift=(kind==='steam'?-26:14);
        p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+dxp.toFixed(1)+'px),calc(-50% + '+(dyp+lift).toFixed(1)+'px)) scale('+endS+')',opacity:0}],{duration:dur,easing:'cubic-bezier(.2,.6,.3,1)'}).onfinish=()=>p.remove(); }
}
function wireGrindWheel(){ const gh=document.getElementById('grindHot'), wheel=document.querySelector('#stMortar .mortar'); if(!gh) return;
    const startG=e=>{ e.preventDefault(); if(prep){ pestleGrinding=true; if(wheel) wheel.classList.add('grinding'); } else hint('Drag an <b>ore</b> onto the <b>wheel</b> first, then hold to grind.'); };
    const stopG=()=>{ pestleGrinding=false; if(wheel) wheel.classList.remove('grinding'); };
    gh.addEventListener('pointerdown',startG); gh.addEventListener('pointerup',stopG); gh.addEventListener('pointercancel',stopG); gh.addEventListener('pointerleave',stopG); }

function wireOrbDrag(){ let drag=false,dx,dy,sx,sy,moved;
    orbEl.addEventListener('pointerdown',e=>{ if(!orbDraggable()) return; e.preventDefault(); drag=true; moved=false; sx=e.clientX; sy=e.clientY; const r=orbEl.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; orbEl.classList.add('dragging'); try{orbEl.setPointerCapture(e.pointerId);}catch(err){} });
    orbEl.addEventListener('pointermove',e=>{ if(!drag) return; if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)>6) moved=true; const b=benchEl().getBoundingClientRect(); orbEl.style.left=(e.clientX-b.left-dx)+'px'; orbEl.style.top=(e.clientY-b.top-dy-dragLift(e))+'px'; });
    const end=()=>{ if(!drag) return; drag=false; orbEl.classList.remove('dragging'); if(!moved && melt && melt.stage==='onAnvil' && melt.traits && melt.traits.length>=1){ openShapeSelect(); return; } handleOrbDrop(); };   // a TAP (no move) on the anvil once you've acquired ≥1 trait → finalize the blade
    orbEl.addEventListener('pointerup',end); orbEl.addEventListener('pointercancel',end); }

// --- water bucket: the mug is a movable sibling; drag it over the anvil to POUR (quench + acquire the reached trait) ---
function mugOverAnvil(){ const a=stAnvil.getBoundingClientRect(), r=mugEl.getBoundingClientRect(); const cx=r.left+r.width*0.5, cy=r.top+r.height*0.62; return cx>a.left-14 && cx<a.right+14 && cy>a.top-34 && cy<a.top+a.height*0.72; }
function canPourQuench(){ return !!(melt && melt.stage==='onAnvil' && melt.reachedTrait); }   // pours ONLY when an ore is on the anvil AND the sword rests on a trait
function positionWater(){ const b=benchEl().getBoundingClientRect(), mr=mugEl.getBoundingClientRect(), ar=stAnvil.getBoundingClientRect();
    const sx=mr.left+mr.width*0.40-b.left, sy=mr.top+mr.height*0.60-b.top, topY=ar.top+ar.height*0.26-b.top;
    const w=document.getElementById('waterPour'); w.style.left=(sx-4.5)+'px'; w.style.top=sy+'px'; w.style.height=Math.max(18,topY-sy)+'px';
    const s=document.getElementById('waterSplash'); const o=(orbEl.style.display!=='none')?orbCenter():{x:sx,y:topY}; s.style.left=o.x+'px'; s.style.top=o.y+'px'; }
function showWaterBurst(){ positionWater(); document.getElementById('waterPour').classList.add('on'); document.getElementById('waterSplash').classList.add('on');
    const o=(orbEl.style.display!=='none')?orbCenter():stationCenter(stAnvil,0.5,0.2);   // quench feedback: white flash + rising steam at the blade
    const qf=document.getElementById('quenchFlash'); if(qf){ qf.style.left=o.x+'px'; qf.style.top=o.y+'px'; qf.classList.remove('on'); void qf.offsetWidth; qf.classList.add('on'); }
    fxBurst(o.x,o.y,{n:12,kind:'steam',ang:-Math.PI/2,spread:1.7,dist:40,size:9,dur:920});
    if(waterTimer) clearTimeout(waterTimer); waterTimer=setTimeout(hideWater,950); }
function hideWater(){ const w=document.getElementById('waterPour'), s=document.getElementById('waterSplash'); if(w) w.classList.remove('on'); if(s) s.classList.remove('on'); if(mugEl) mugEl.classList.remove('pouring'); if(waterTimer){ clearTimeout(waterTimer); waterTimer=null; } }
function wireMug(){ const m=mugEl, bench=benchEl(); let drag=false,dx,dy;
    m.addEventListener('pointerdown',e=>{ e.preventDefault(); drag=true; const r=m.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; m.style.zIndex=24; try{m.setPointerCapture(e.pointerId);}catch(err){} });
    m.addEventListener('pointermove',e=>{ if(!drag) return; const b=bench.getBoundingClientRect(); let x=e.clientX-b.left-dx, y=e.clientY-b.top-dy-dragLift(e); const q=dragBox(m,b,40); x=Math.max(q.x0,Math.min(q.x1,x)); y=Math.max(q.y0,Math.min(q.y1,y)); m.style.left=x+'px'; m.style.top=y+'px';
        if(mugOverAnvil() && canPourQuench()){ m.classList.add('pouring'); showWaterBurst(); tryAcquire(); }   // pour → quench + acquire (fires once: tryAcquire clears reachedTrait)
        else if(!mugOverAnvil()){ m.classList.remove('pouring'); } });
    const end=()=>{ if(!drag) return; drag=false; homeMug(); m.style.zIndex=3; m.classList.remove('pouring'); };   // release → snap back into the bucket (water burst finishes on its own timer)
    m.addEventListener('pointerup',end); m.addEventListener('pointercancel',end); }

// element footprints as FRACTIONS of #frame (the game side of the anchor pixel-% size match).
// Compared against the anchor element boxes in tooling/anchor-match/spec.hori.json by element_size.py.
const FRAME_BOX_SEL={ furnace:'#stSmelt .furnace', bellows:'#stSmelt .bellowtop',
    anvil:'#stAnvil .anvil', wheel:'#stMortar .mortar', dragon:'#dragon .crop', bucket:'#bucketBack', hammer:'#hammerTool',
    mug:'#mug', hud:'#hud', rail:'#rail', map:'#map-wrap', skilltree:'#skillBtn' };
function frameBoxes(){ const f=document.getElementById('frame'); if(!f) return {}; const fr=f.getBoundingClientRect(); const out={};
    for(const name in FRAME_BOX_SEL){ const el=document.querySelector(FRAME_BOX_SEL[name]); if(!el) continue; const r=el.getBoundingClientRect();
        out[name]={ x:+((r.left-fr.left)/fr.width).toFixed(4), y:+((r.top-fr.top)/fr.height).toFixed(4), w:+(r.width/fr.width).toFixed(4), h:+(r.height/fr.height).toFixed(4) }; }
    return out; }

function initMechanics(){ stMortar=document.getElementById('stMortar'); stSmelt=document.getElementById('stSmelt'); stAnvil=document.getElementById('stAnvil'); mugEl=document.getElementById('mug'); orbEl=document.getElementById('orb'); oreImgEl=document.getElementById('orb-ore'); sphereEl=document.getElementById('orb-sphere'); fireEl=document.getElementById('dragonFire'); hammerEl=document.getElementById('hammerTool');

    window.SFM = { state:()=>({segCount:segs.length, sword:{...sword}, pull:{...pull}, routeEnd:routeEnd(), swordPt:swordPoint(), melt:melt&&{...melt}, prep:prep&&{...prep}, gateReady, bellowing, pestleGrinding, dragonBreathing, retreating}),
        routeEnd, swordOut, startPrep, setGrind:g=>{ if(prep){prep.grind=g; updateOrbLook(); drawPrepPreview();} }, addPrep, addOreDirect,
        ready:markGateReady, setHeat:h=>{ if(melt){melt.heat=h; updateGauges();} }, openGate, placeOnAnvil, reinsert,

// ============================================================
//  LAYOUT SELF-TEST — drift + in-zone + parity guard (Phase 0)
//  Runs only with ?test in the URL. Single source of truth for the
//  recorded portrait LAYOUT is specs/2026-08-13-looptest-layout-skeleton.md.
// ============================================================
function runLayoutSelfTest(){
    const EPS=0.08, fails=[];   // allows intentional edge bleeds (furnace pokes above, dragon/anvil bleed left) while still catching gross off-zone errors
    const RECORDED={ stSmelt:{x:0.539,y:-0.816,w:0.24}, stMortar:{x:0.795,y:-0.289,w:0.23}, pestle:{x:0.837,y:0.30,w:0.053}, hammerTool:{x:0.247,y:0.449,w:0.165}, stAnvil:{x:0.187,y:-0.249,w:0.191}, bucket:{x:0.019,y:0.041,w:0.171}, mug:{x:0.054,y:-0.025,w:0.11}, dragon:{x:0.081,y:-0.989,w:0.228} };   // hori-anchor LANDSCAPE composition, loop r20 (rebased to the 21% rail; frame-relative prop sizes preserved)
    if(typeof LAYOUT==='undefined') fails.push('LAYOUT undefined');
    if(typeof resolveLayout!=='function') fails.push('resolveLayout missing');
    if(!fails.length){
        const pk=Object.keys(LAYOUT.portrait).sort(), lk=Object.keys(LAYOUT.landscape).sort();
        if(pk.join(',')!==lk.join(',')) fails.push('parity: ['+pk+'] vs ['+lk+']');
        ['portrait','landscape'].forEach(o=>{ for(const k in LAYOUT[o]){ const b=resolveLayout(k,o,1,1);
            const yMin = (o==='landscape') ? -1.30 : -EPS;   // r14: bench band is 24.5% of the frame, so props standing on the floor rise ~0.8 bench-heights over the map (overflow:visible); still catches gross off-zone errors
            if(!(b.x>=-EPS && b.y>=yMin && b.x+b.w<=1+EPS && b.y<=1)) fails.push('in-zone '+o+'.'+k+' '+JSON.stringify(b)); } });
        const rk=Object.keys(RECORDED).sort(), lkk=Object.keys(LAYOUT.landscape).sort();
        if(rk.join(',')!==lkk.join(',')) fails.push('drift key-set: landscape ['+lkk+'] != recorded ['+rk+']');   // extra/removed key in landscape, not just per-value drift
        for(const k in RECORDED){ const r=RECORDED[k], a=LAYOUT.landscape[k]; if(!a){ fails.push('missing landscape.'+k); continue; } ['x','y','w'].forEach(ax=>{ if(Math.abs(a[ax]-r[ax])>0.0005) fails.push('drift '+k+'.'+ax+' '+a[ax]+' != '+r[ax]); }); }
        const bl=LAYOUT.landscape.bucket, rl=resolveLayout('bucket','landscape',1000,500);   // resolveLayout math check: expectations derived from the table (RECORDED already pins the values), so a deliberate layout change cannot leave a stale hardcoded number here
        if(Math.abs(rl.x-bl.x*1000)>0.6||Math.abs(rl.y-bl.y*500)>0.6||Math.abs(rl.w-bl.w*1000)>0.6) fails.push('resolve math '+JSON.stringify(rl));
    }
    const pass=fails.length===0; (pass?console.log:console.error)('[layout selftest] '+(pass?'GREEN ✓':'RED ✗ ('+fails.length+')'), fails);
    return { pass, fails };
}
