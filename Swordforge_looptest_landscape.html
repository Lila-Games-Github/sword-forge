<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, user-scalable=no">
<title>Swordforge — Loop Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body { font-family: Arial, sans-serif; background: #2b2b2b; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 0; }

/* ---- phone frame — fixed 9:16 (568×1010); the width=568 viewport scales it to fit any phone ---- */
/* SKELETON: a CSS grid of named zones (hud / map / bench). Two grid-template-areas — portrait
   (default) and landscape (#frame.landscape) — flip the whole layout. Props are placed INSIDE
   zones by the data-driven LAYOUT table (see the script), never by hardcoded pixels. */
#frame {
    width: 1080px;
    height: 600px;
    background: #14100a;
    position: relative; overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.6);
    --rail-w: 21%;   /* r20: right column widened to match the owner's UI reference (was 13%) */
    display: grid;
    grid-template-columns: 1fr var(--rail-w);
    grid-template-rows: auto 42% 1fr;
    grid-template-areas:
      "hud  hud"
      "map  rail"
      "bench rail";
}
/* landscape (hori-anchor target: wide map top, wide diorama bench bottom, ore rail down the right) */
#frame.landscape {
    grid-template-columns: 1fr var(--rail-w);
    grid-template-rows: 75.5% 1fr;   /* r13: map grown to the reference 0.755 height (was 54%); props stand on the floor line and bleed up over the parchment */
    grid-template-areas:
      "map  rail"
      "bench rail";
}
/* landscape HUD floats over the map (anchor style): vertical wood-plaque stack top-left + Skill Tree top-right */
#frame.landscape > #hud { position: absolute; left: 12px; top: 12px; z-index: 20; width: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 7px; padding: 0; background: none; border: none; box-shadow: none; }
#frame > #hud { grid-area: hud; }
#frame > #map-wrap { grid-area: map; min-height: 0; }
#frame > #bench { grid-area: bench; min-height: 0; }
#frame > #rail { grid-area: rail; min-height: 0; position: relative; overflow: hidden;
    background: #211610 url('assets/ui/rail_wood.png') center bottom / 100% 94% no-repeat;   /* anchor: thin dark forge-wall gap at the very top, warm wood ore board fills the rest (board top warm, not a big dark void) */
    border-left: 4px solid #6a4a24; box-shadow: inset 3px 0 7px rgba(0,0,0,.45); }
#frame.landscape > #rail { display: block; }   /* landscape ore rail visible (hori anchor) */

/* ---- header / HUD (landscape: vertical wood-plaque stack; see #frame.landscape > #hud for layout) ---- */
#hud { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: linear-gradient(180deg,#38291a,#211812); border-bottom: 3px solid #7a5f34; box-shadow: inset 0 -2px 5px rgba(0,0,0,.4); }
/* carved wood/parchment plaque (anchor HUD chrome) */
.plaque { display: flex; align-items: center; gap: 7px; font-family: 'Cinzel', serif; font-weight: 700; color: #f2e3c0; white-space: nowrap; font-size: 13px;
    border: 13px solid transparent; border-image: url('assets/ui/plaque_stone.png') 64 fill / 13px / 0 stretch;   /* anchor-cut grey-stone plaque chrome (9-slice); replaces the CSS dark-wood pill */
    padding: 3px 10px; filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)); text-shadow: 0 1px 1px rgba(0,0,0,.7); }
.plaque .ic { font-size: 16px; }
.plaque .ic.gear { color: #ffcf6a; font-size: 18px; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.plaque.lvl { gap: 6px; } .plaque.lvl .pk { color: #ffcf6a; font-weight: 900; } .plaque.lvl .pv { font-size: 10px; letter-spacing: 1px; color: #d8bd86; }
.plaque.btn { cursor: pointer; } .plaque.btn:active { transform: scale(.96); }
.plaque.btn img { width: 22px; height: 22px; object-fit: contain; }
/* r20: #skillBtn moved inside #statPanel in the right column (see the right-column block below). */
#frame.landscape .map-tag { display: none; }   /* hide the debug map label under the floating HUD */
#frame.landscape #compass { display: none; }   /* hori anchor has no compass rose */
#frame.landscape .zoom button { width: 24px; height: 24px; font-size: 15px; }   /* smaller zoom controls */
.hud-item, .hud-med { display: flex; align-items: center; font-family: 'Cinzel', serif; font-weight: 700; color: #f0d9a4; white-space: nowrap; }
.hud-item.gold { gap: 5px; background: rgba(0,0,0,0.5); border: 1px solid #7a5f34; border-radius: 15px; padding: 5px 12px; font-size: 13px; color: #fceeb5; }
.hud-item.gold .ic { font-size: 16px; }
.hud-item.lvl { gap: 6px; background: rgba(0,0,0,0.5); border: 1px solid #7a5f34; border-radius: 10px; padding: 4px 11px; font-size: 13px; }
.hud-item.lvl .lv { color: #ffd98a; font-weight: 900; } .hud-item.lvl .lvcap { font-size: 10px; letter-spacing: 1px; color: #d8c39a; }
.hud-item.day { gap: 5px; background: rgba(0,0,0,0.5); border: 1px solid #7a5f34; border-radius: 15px; padding: 5px 12px; font-size: 12px; color: #fceeb5; }
.hud-item.day .ic { font-size: 15px; }
/* circular medallion buttons (Recipe / Skill Tree) */
.hud-med { flex-direction: column; gap: 1px; background: none; border: none; cursor: pointer; padding: 0; }
.hud-med:active { transform: scale(0.95); }
.hud-med .med-ic { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 42% 34%,#4a3826,#241a0f); border: 2px solid #c8a84b; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,.55), inset 0 1px 2px rgba(255,220,150,.25); }
.hud-med .med-ic img { width: 32px; height: 32px; object-fit: contain; }
.hud-med .med-ic.glyph { font-size: 21px; color: #ffd98a; }
.hud-med.skilltree { margin-left: auto; }   /* push Skill Tree to the far right like the hori anchor */
.hud-med .med-cap { font-size: 9px; color: #e9dcbf; letter-spacing: .3px; }
/* centered star level */
.hud-center { margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0; font-family: 'Cinzel', serif; color: #ffd98a; }
.hud-starrow { font-size: 15px; letter-spacing: 1px; color: #ffcf3a; text-shadow: 0 1px 2px #000; line-height: 1; }
.hud-starrow .half { opacity: .4; }
.hud-sl { font-size: 9px; font-weight: 700; color: #e9dcbf; letter-spacing: .3px; }
.hud-btn.back { background: linear-gradient(180deg,#3a2c1b,#241a0f); border: 1px solid #7a5f34; border-radius: 9px; padding: 4px 11px; font-size: 17px; line-height: 1; cursor: pointer; color: #f0d9a4; font-weight: 700; }
.hud-btn.back:active { transform: scale(0.95); }
/* compass on the map + furnace smoke (Phase 1 art) */
#compass { position: absolute; left: 8px; bottom: 8px; width: 62px; height: 62px; z-index: 6; opacity: 0.9; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.55)); }
#furnaceSmoke { position: absolute; left: 37%; top: 2%; width: 13%; z-index: 5; opacity: .6; pointer-events: none; transform-origin: bottom center; animation: smokeRise 6s ease-in-out infinite; }   /* vents up from the furnace crucible mouth, above the furnace, inside the visible bench */
@keyframes smokeRise { 0% { opacity: 0; transform: translateY(12px) scale(.85); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-16px) scale(1.15); } }
/* heat gauge — relocated out of the HUD into a small bench overlay near the furnace */
#heatMini { position: absolute; left: 41%; top: 10%; transform: translateX(-50%); z-index: 12; display: flex; align-items: center; gap: 4px; background: rgba(20,15,8,0.7); border: 1px solid #6a5636; border-radius: 8px; padding: 3px 6px; }   /* centered over the furnace, lowered 10% */
.gauge { display: flex; align-items: center; gap: 4px; }
.gauge .lbl { font-size: 12px; }
.gauge .track { width: 52px; height: 10px; background: #211a11; border: 1px solid #5a4629; border-radius: 6px; overflow: hidden; }
.gauge .fill { height: 100%; width: 0%; border-radius: 5px; transition: width .12s linear; }
.gauge .fill.heat { background: linear-gradient(90deg,#b8541f,#ff8c2a,#ffd24a); }

/* ---- MAP (copied look from SwordforgeV2) ---- */
#map-wrap { overflow: hidden; background: #241812; position: relative; }   /* dark forge-wall backing: torn parchment (clipped #board) on the wall; r11b: border-bottom removed (it cut a line across the furnace crossing the map/bench boundary) */
#board { clip-path: polygon(1% 5%,6% 1.5%,15% 4%,27% 1%,40% 3.5%,52% 1%,65% 3.5%,78% 1%,90% 3.5%,97% 1.5%,99.3% 6%,100% 24%,98.6% 46%,100% 68%,98.5% 90%,99% 99%,82% 97.5%,60% 99.5%,38% 97.5%,15% 99.5%,2.5% 98%,0.7% 80%,2% 55%,0.6% 30%); }   /* torn parchment deckle edge (organic notches) revealing the dark wall behind, like the anchor treasure-map */
#frame.landscape #map-wrap::after { content: ""; position: absolute; inset: 0; z-index: 8; pointer-events: none;   /* torn dark edge + corner vignette so the parchment reads like the anchor map, bled to the panel edges */
    box-shadow: inset 0 0 46px rgba(48,30,10,.5); }   /* r11b: dropped the strong bottom inset band — it drew a dark line across the whole map/bench boundary */
#board { width: 100%; height: 100%; display: block; touch-action: none; }
/* r16: the painted territory art (#mapArt) was removed - the board is now the flat beige base rect, so traits/hazards can be placed truthfully instead of being hidden behind a picture. */
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 7; }
.zoom button { width: 30px; height: 30px; border-radius: 7px; border: 1px solid #6a5636; background: rgba(25,20,12,0.8); color: #f0e8d6; font-size: 18px; font-weight: bold; cursor: pointer; line-height: 1; }
.map-tag { position: absolute; left: 8px; top: 8px; z-index: 6; background: rgba(20,15,8,0.72); color: #e9dcbf; border: 1px solid #6a5636; border-radius: 7px; padding: 3px 8px; font-size: 10px; font-weight: bold; }

/* ---- BENCH (crafting stations laid out in sequence) ---- */
#bench { position: relative; overflow: visible;   /* let props BLEED across zones (furnace crucible into the map, wheel into the rail) like the anchor; #frame still clips the outer bounds */
    background: #1a130b url('assets/backgrounds/anchor_bench_bg.png') center/cover no-repeat;
    box-shadow: inset 0 6px 18px rgba(0,0,0,.5);
}
#bench::after { content: ""; position: absolute; inset: 0; pointer-events: none;   /* soft vignette so layered props stay readable */
    background: radial-gradient(125% 95% at 50% 42%, transparent 55%, rgba(0,0,0,0.38) 100%); }
#bench::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;   /* r11b: wash pushed behind bench content + cleared — it was tinting the lower half of the furnace where it crosses the bench top (the faint seam). Floor is already warm. */
    background: transparent; }

.station { position: absolute; z-index: 2; }
.station img { display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; filter: drop-shadow(0 5px 7px rgba(0,0,0,.55)); }
.badge { position: absolute; top: -9px; left: -9px; z-index: 4; width: 22px; height: 22px; border-radius: 50%;
    background: #c8a84b; color: #241a0c; font-weight: 900; font-size: 12px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #241a0c; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.cap { position: absolute; left: 50%; transform: translateX(-50%); bottom: -17px; white-space: nowrap;
    font-size: 10px; font-weight: bold; color: #e9dcbf; text-shadow: 0 1px 2px #000; letter-spacing: .3px; }
.cap small { font-weight: normal; color: #b6a684; }

/* ore tray (compact, top-left) */
/* ore rail — #oreShelf now fills the right-edge rail zone as a vertical scroll column (Phase 1) */
#oreShelf { position: absolute; top: 11%; left: 0; right: 0; bottom: 0; z-index: 3;
    display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 6px; padding: 8px 5px 8px;
    overflow-y: auto; overflow-x: hidden; background: transparent; border: none; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
#oreShelf::-webkit-scrollbar { width: 5px; } #oreShelf::-webkit-scrollbar-thumb { background: #5a4526; border-radius: 3px; }
#oreShelf .badge, #oreShelf .shelf-cap { display: none; }   /* no step badge, no 'Ores' header (anchor rail has neither) */
.ore-slot { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px; padding: 5px 2px 4px; border-radius: 9px;
    background: linear-gradient(180deg,#2a2013,#171009); border: 1px solid #55411f; box-shadow: inset 0 -2px 4px rgba(0,0,0,.5), inset 0 1px 0 rgba(120,90,45,.25); touch-action: none; padding: 9px 3px 7px; }   /* darker carved-wood slot (anchor rail); touch-action:none so a touch-drag isn't hijacked as a page scroll */
.ore-slot span:not(.ore-count) { display: none; }   /* anchor rail shows ore + count only, no name labels */
.ore-count { position: absolute; right: 2px; bottom: 2px; top: auto; font-size: 7px; font-weight: bold; color: #fceeb5; background: rgba(0,0,0,0.72); border: 1px solid #6a5636; border-radius: 4px; padding: 0 2px; line-height: 1.35; }   /* small tucked count badge (anchor rail) */
.ore-slot img { width: 50px; height: 50px; object-fit: contain; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }   /* larger ore icons to fill the board like the anchor rail (was 34) */
.ore-slot span { font-size: 8px; font-weight: bold; color: #e4d6b4; max-width: 100%; white-space: normal; text-align: center; line-height: 1.1; }

/* station image sizes (arranged per reference) */
.mortar { width: 100%; }                 /* fills its %-sized station wrapper (size set by LAYOUT) */
.furnace { width: 100%; display: block; }/* smelter fills its station; new anchor-cut smelter (crossed A-frame bracing, centre-left arch, flared rim) is already anchor-oriented — no flip */
#frame.landscape #stSmelt { z-index: 3; }   /* r12: furnace+bellows above the wheel (stMortar) so the bellows ring handle at the back-right isn't occluded (Opus audit fix) */
/* r24: the separate .cauldron overlay (assets/forge/anchor_cauldron.png) was removed from the scene.
   It had been display:none since r10, when the molten pot was baked into the re-cut anchor_furnace.png,
   so it drew nothing — the glowing pot you see on the furnace crown is part of the furnace art. */
/* ---- station JUICE (Phase B feel) ---- */
#grindHot { position: absolute; left: 22%; top: 4%; width: 56%; height: 56%; z-index: 6; cursor: pointer; }
.mortar.grinding { animation: grindShake .11s linear infinite; }   /* the wheel judders as it grinds */
@keyframes grindShake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-1px,.5px); } 75% { transform: translate(1px,-.5px); } }
/* furnace heat glow — opacity is driven live from the heat gauge (0→1) */
.furnaceGlow { position: absolute; left: 11%; top: 56%; width: 30%; height: 30%; z-index: 1; pointer-events: none; opacity: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 62%, rgba(255,180,70,.85), rgba(255,120,30,.4) 45%, rgba(255,90,20,0) 72%); mix-blend-mode: screen; }
.anvil.recoil { animation: anvilRecoil .12s ease-out; }   /* the anvil takes the blow */
@keyframes anvilRecoil { 0% { transform: translateY(0); } 40% { transform: translateY(3px) scaleY(.985); } 100% { transform: translateY(0); } }
#quenchFlash { position: absolute; z-index: 24; width: 90px; height: 60px; margin: -30px 0 0 -45px; border-radius: 50%; display: none; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.95), rgba(210,235,255,.5) 50%, rgba(190,220,255,0) 78%); }
#quenchFlash.on { display: block; animation: quenchPop .5s ease-out; }
@keyframes quenchPop { 0% { transform: scale(.4); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.anvil { width: 100%; }

/* bellows — the anchor cut is a standalone prop parked at the furnace's left base (pump anim still applies) */
.bellowtop { position: absolute; left: 52%; top: 62%; width: 84%; display: block; -webkit-user-drag: none; pointer-events: none; z-index: 3; }   /* r12: fresh full anchor-cut bellows (nozzle points left into the furnace), tucked against the furnace-front-right base */
.bellow-tag { position: absolute; left: -6%; top: 92%; transform: translateX(-50%); z-index: 3; font-size: 9px; font-weight: bold; color: #e9dcbf; background: rgba(20,15,8,0.72); border: 1px solid #6a5636; border-radius: 6px; padding: 1px 5px; white-space: nowrap; text-shadow: 0 1px 2px #000; }

/* movable pestle — bigger, stands in the mortar, draggable (width/pos from LAYOUT.*.pestle) */
#pestle { position: absolute; z-index: 5; cursor: grab; touch-action: none; transform: rotate(50deg); transform-origin: bottom center; display: none; }   /* landscape grind station is the wheel (anchor_grindwheel); pestle hidden, layout entry kept for parity */
#pestle img { width: 100%; display: block; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
#pestle:active { cursor: grabbing; }

/* movable hammer — drag it; near the anvil it rotates & strikes the anvil top */
#hammerTool { position: absolute; z-index: 8; cursor: grab; touch-action: none; transform: rotate(0deg); transform-origin: 40% 80%; }   /* anchor hammer art is pre-rotated (head up-right); width/pos from LAYOUT.*.hammerTool */
#hammerTool img { width: 100%; display: block; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 5px 7px rgba(0,0,0,.55)); }
#hammerTool:active { cursor: grabbing; }
.dragging { z-index: 35 !important; }   /* r22: a prop dragged up over the map/HUD stays visible */
#hammerTool.striking { animation: hammerStrike 0.3s ease-in-out infinite; }
@keyframes hammerStrike { 0%,100% { transform: translateY(-5px) rotate(-8deg); } 55% { transform: translateY(7px) rotate(18deg); } }   /* tuned for the pre-rotated anchor hammer */
#hammerSpark { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; pointer-events: none; display: none; z-index: 7; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,244,190,0.95) 0%, rgba(255,186,66,0.6) 42%, rgba(255,140,20,0) 72%); }
#hammerSpark.on { display: block; animation: sparkPulse 0.32s ease-in-out infinite; }
@keyframes sparkPulse { 0%,100% { transform: scale(0.45); opacity: 0.35; } 55% { transform: scale(1.15); opacity: 1; } }

/* cropped dragon (visible dragon sits off-centre on a big canvas) */
.crop { position: relative; overflow: hidden; }
.crop img { position: absolute; display: block; max-width: none; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 5px 7px rgba(0,0,0,.55)); }
.dragoncrop { width: 100%; aspect-ratio: 255 / 230; height: auto; overflow: visible; }   /* r13: was a hardcoded 255x230 px, so LAYOUT.dragon.w never sized it (only positioned it) - now %-driven like every other prop, aspect preserved */
.dragoncrop img { width: 100%; height: 100%; object-fit: contain; left: 0; top: 0; }

/* dragon — free-roaming, bottom-left, draggable */
#dragon { position: absolute; z-index: 30; cursor: grab; touch-action: none; }   /* r11b: dragon layered above everything (owner feedback) */
#dragon:active { cursor: grabbing; }
#dragon .cap { bottom: -4px; background: rgba(20,15,8,0.68); padding: 2px 7px; border-radius: 7px; border: 1px solid #6a5636; }

/* ---- 5 · Quench — water bucket: Bucket3_back/_mug/_front share one 1984×2116 canvas; the mug is a movable sibling that interleaves BETWEEN back(z2) and front(z4) so it sits IN the bucket ---- */
.bucket-layer { position: absolute; display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; filter: drop-shadow(0 5px 7px rgba(0,0,0,.55)); }
#mug { position: absolute; cursor: grab; touch-action: none; transform: scaleX(-1) rotate(-32deg); transform-origin: 52% 62%; transition: transform .14s ease; }   /* r11: flipped (owner feedback) + tipped onto the bucket rim */
#mug img { width: 100%; display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
#mug:active { cursor: grabbing; }
#mug.pouring { transform: scaleX(-1) rotate(-78deg); }   /* tips further to pour (flip preserved) */
.bucket-cap { position: absolute; z-index: 5; transform: translateX(-50%); white-space: nowrap; font-size: 10px; font-weight: bold; color: #e9dcbf; text-shadow: 0 1px 2px #000; letter-spacing: .3px; }
.bucket-cap small { font-weight: normal; color: #b6a684; }
/* placeholder pour stream + splash */
#waterPour { position: absolute; width: 9px; z-index: 23; display: none; pointer-events: none; border-radius: 5px;
    background-image: repeating-linear-gradient(180deg, rgba(158,222,255,.95) 0 7px, rgba(120,200,255,.35) 7px 15px);
    background-size: 100% 15px; box-shadow: 0 0 6px rgba(120,200,255,.7); }
#waterPour.on { display: block; animation: waterFlow .4s linear infinite; }
@keyframes waterFlow { to { background-position: 0 15px; } }
#waterSplash { position: absolute; width: 46px; height: 20px; margin: -6px 0 0 -23px; z-index: 23; display: none; pointer-events: none; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 35%, rgba(190,235,255,.9), rgba(120,200,255,.25) 65%, rgba(120,200,255,0) 80%); }
#waterSplash.on { display: block; animation: splashPulse .4s ease-in-out infinite; }
@keyframes splashPulse { 0%,100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }

.legend { position: absolute; left: 8px; right: 8px; bottom: 6px; z-index: 3;
    font-size: 9.5px; color: #b6a684; text-align: center; line-height: 1.4; }

/* ---- crafting mechanics ---- */
#orb { position: absolute; width: 38px; height: 38px; z-index: 9; display: none; cursor: grab; touch-action: none; }
#orb.dragging { cursor: grabbing; z-index: 22; }
#orb-ore { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
#orb-sphere { position: absolute; inset: 3px; border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 38% 32%, #d9d2c6, #6f6a62 52%, #2a2724 100%);
    box-shadow: inset -4px -5px 7px rgba(0,0,0,.5), inset 3px 3px 5px rgba(255,255,255,.22); }
#orb.hot #orb-ore { opacity: 0 !important; }
#orb.hot #orb-sphere { background: radial-gradient(circle at 40% 34%, #fff2c4, #ff9a3c 44%, #c0431a 100%);
    box-shadow: 0 0 15px 4px rgba(255,140,40,.8), inset -3px -4px 6px rgba(120,20,0,.5); animation: orbPulse 1s ease-in-out infinite; }
@keyframes orbPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
#pestle.pounding { animation: pound .26s ease-in-out infinite; }
@keyframes pound { 0%,100% { transform: rotate(10deg) translateY(0); } 50% { transform: rotate(10deg) translateY(8px); } }
#bellowHot, #furnaceGate { position: absolute; z-index: 5; cursor: pointer; }
#bellowHot { left: 52%; top: 60%; width: 78%; height: 34%; }   /* covers the fresh anchor-cut bellows (r12) */
#furnaceGate { left: 12%; top: 58%; width: 30%; height: 28%; border-radius: 9px; }   /* lava mouth: centre-left arch of the re-cut tall smelter. r23b: an attempted "realignment" to 41% was REVERTED - it came from a pixel scan whose furnace box was measured at an 800px viewport but applied to a 1080px render, so it scanned the wrong region. This original box is on the arch; owner confirmed. */
#furnaceGate.ready { box-shadow: inset 0 0 0 2px rgba(255,180,60,.9), 0 0 16px 4px rgba(255,150,40,.7); animation: gatePulse .95s ease-in-out infinite; }
@keyframes gatePulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.bellowtop.pumping { animation: pump .28s ease-in-out infinite; transform-origin: 20% 74%; }
@keyframes pump { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
#dragonFire { position: absolute; z-index: 7; width: 130px; pointer-events: none; -webkit-user-drag: none; display: none; filter: drop-shadow(0 0 6px rgba(255,140,30,.85)); }
#sfHint { position: absolute; left: 8px; right: 8px; bottom: 6px; z-index: 12; text-align: center; font-size: 11px; line-height: 1.35; color: #ffe6b8; background: rgba(20,14,7,0.82); border: 1px solid #6a5636; border-radius: 8px; padding: 5px 9px; text-shadow: 0 1px 2px #000; }   /* moved to the bottom so it stops capping the furnace crown */
#sfHint b { color: #ffd98a; }
#forgeResult { position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%); z-index: 30; display: none; text-align: center; font-family: 'Cinzel', serif; font-weight: 700; font-size: 20px; line-height: 1.3; color: #ffe08a; background: rgba(20,14,7,0.94); border: 2px solid #c8a84b; border-radius: 12px; padding: 14px 22px; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
#forgeResult.show { display: block; animation: resultPop .45s ease-out; }
@keyframes resultPop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.7); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

/* acquired-traits strip (top-right of the map) */
/* r21: #sfTraits (acquired-trait strip over the map) replaced by #bladePanel top-left. */
/* r32 — book pickups. The CSS animations sit on an INNER <g>: the outer group already carries a
   transform="translate(x,y)" attribute, and a CSS transform would replace it, teleporting the book to
   the world origin mid-pop. SVG transform-origin defaults to 0 0, so the inner scale is about the
   book's own centre for free. */
#books .bookIt { opacity: .93; }
.bookIt.gone { animation: bookPop .45s ease-out forwards; }
@keyframes bookPop { 0% { transform: scale(1); opacity: 1; } 55% { transform: scale(1.45); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
.bookXp { font-family: 'Cinzel', serif; font-weight: 700; fill: #ffe9a8; paint-order: stroke;
    stroke: rgba(20,14,7,.92); stroke-width: 5px; animation: bookXp 1.15s ease-out forwards; }
@keyframes bookXp { 0% { opacity: 0; transform: translateY(2px) scale(.7); } 16% { opacity: 1; transform: translateY(-10px) scale(1.12); } 100% { opacity: 0; transform: translateY(-52px) scale(1); } }
#expRow { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 6px;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 11px; color: #e8d3a4; letter-spacing: .4px; }
#expRow .ic { font-size: 12px; }
#expRow .u { color: #a68d63; font-size: 9px; }
#expRow.bump { animation: expBump .45s ease-out; }
@keyframes expBump { 0%,100% { transform: scale(1); color: #e8d3a4; } 35% { transform: scale(1.22); color: #ffe08a; } }

/* blade integrity (r16) — hazard zones damage the active sword */
#sfHp { position: absolute; right: 8px; top: 8px; z-index: 6; display: none; align-items: center; gap: 6px; padding: 4px 7px; background: rgba(20,15,8,0.62); border: 1px solid #6a5636; border-radius: 8px; }
#sfHp .lbl { font-size: 13px; color: #e8dcc0; }
#sfHp .bar { display: block; width: 84px; height: 7px; background: #2a2016; border: 1px solid #6a5636; border-radius: 4px; overflow: hidden; }
#sfHp .fill { display: block; height: 100%; width: 100%; background: #5fd35f; transition: width .12s linear, background .2s linear; }
#sword.hurt { animation: swordHurt .5s ease-in-out infinite; }
@keyframes swordHurt { 0%,100% { filter: drop-shadow(0 0 3px #ff3b30); } 50% { filter: drop-shadow(0 0 12px #ff3b30); } }

/* ---- shape select + hammer minigame (ported from swordforgeV2) ---- */
.sf-modal { position: absolute; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); }
.sf-modal.show { display: flex; }
.sf-modal-box { background: #e8dcc0; border: 2px solid #6a5636; border-radius: 12px; padding: 16px; width: 86%; max-width: 320px; box-shadow: 0 12px 34px rgba(0,0,0,0.55); }
.sf-modal-h { margin: 0 0 4px; color: #4a3623; font-family: 'Cinzel', serif; text-align: center; font-size: 16px; }
.sf-modal-sub { margin: 0 0 12px; font-size: 11px; color: #5c4a33; text-align: center; }
.sf-shape-grid { display: flex; gap: 8px; }
.sf-shape { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 4px; background: #f3ead6; border: 2px solid #cbb98f; border-radius: 10px; cursor: pointer; font-family: 'Cinzel', serif; color: #4a3623; font-weight: bold; }
.sf-shape .ic { font-size: 26px; line-height: 1; }
.sf-shape span { font-size: 10px; }
.sf-shape:active { background: #e6d7b8; transform: scale(0.97); }
/* trait acquired popup */
.sf-acquire-box { max-width: 260px; }
.sf-acquire-body { text-align: center; margin: 8px 0 6px; }
.sf-acquire-body .sym { display: block; font-size: 56px; line-height: 1; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
.sf-acquire-body .nm { font-family: 'Cinzel', serif; font-weight: 700; font-size: 19px; color: #4a3623; }
.sf-acquire-body .tr { font-size: 13px; font-weight: bold; margin-top: 3px; letter-spacing: .3px; }
.sf-acquire-body .cnt { font-size: 11px; color: #6b573c; margin-top: 6px; }
.sf-continue { text-align: center; font-size: 12px; font-weight: bold; color: #7a5a2b; cursor: pointer; padding: 8px 0 2px; margin-top: 10px; border-top: 1px solid #cbb98f; letter-spacing: .5px; }
.sf-continue:hover { color: #4a3623; }
/* ============================================================
   r31 — HAMMER SCENE. hammer_bg / hammer_dragon / hammer_hammer / hammer_sword are four owner layers
   exported on ONE 1877x1025 canvas, so any of them drawn at inset:0 inside a box of that aspect is
   registered pixel-for-pixel with the others. The dragon is the exception — its sprite sits mid-canvas,
   so HM_RIG places and rotates it about a fixed pivot. Every rig number is a PERCENT of the stage.

   The loop: heat the metal with the dragon, strike it while it glows, repeat. Heat leaks away on its
   own. There is deliberately NO heat meter — the glow, the colour and the sparks are the whole readout.
   ============================================================ */
.hm-modal { background: #0b0806; }
.hm-scene { position: relative; width: 100%; max-width: 100%; max-height: 100%; aspect-ratio: 1877 / 1025; margin: auto; overflow: hidden; touch-action: none; }
.hm-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
/* --- the workpiece: three renders of the same metal, cross-faded by shape progress --- */
#hmWork { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
#hmWork > * { position: absolute; transform-origin: 50% 50%; }
#hmWork.jolt  { animation: hmJolt .17s ease-out; }
#hmWork.chill { animation: hmChill .26s ease-out; }
@keyframes hmJolt  { 0%,100% { transform: translate(0,0); } 35% { transform: translate(0,5px); } 70% { transform: translate(0,-2px); } }
@keyframes hmChill { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-6px,0); } 75% { transform: translate(6px,0); } }
/* the sphere is the crafting screen's orb, both of its states stacked: .hot fades in with the heat */
#hmOrb { border-radius: 50%; }
#hmOrb > div { position: absolute; inset: 0; border-radius: 50%; }
#hmOrb .cold { background: radial-gradient(circle at 38% 32%, #d9d2c6, #6f6a62 52%, #2a2724 100%);
    box-shadow: inset -7px -9px 13px rgba(0,0,0,.5), inset 5px 5px 9px rgba(255,255,255,.22); }
#hmOrb .hot { opacity: 0; background: radial-gradient(circle at 40% 34%, #fff2c4, #ff9a3c 44%, #c0431a 100%);
    box-shadow: inset -6px -8px 12px rgba(120,20,0,.5); }
#hmRough, #hmFinal { opacity: 0; }
/* a bloom of forge-glow over the anvil, brightest halfway through a shape change — it hides the moment
   where both renders are semi-transparent, which otherwise reads as a ghost rather than as metal moving */
#hmMorph { position: absolute; opacity: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,236,190,.95), rgba(255,150,50,.55) 42%, rgba(255,120,30,0) 72%); }
/* --- dragon: ONE wrapper rotated about the tail. The fire and the two aim markers live inside it, so
       they inherit the head's rotation and the flame always points where the head points. --- */
#hmDragon { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
#hmDragon > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; filter: drop-shadow(0 12px 20px rgba(0,0,0,.55)); }
#hmSnout, #hmAim { position: absolute; width: 0; height: 0; }
#hmHead { position: absolute; left: 41%; top: 46%; width: 19%; height: 42%; pointer-events: auto; cursor: grab; touch-action: none; }
#hmDragon.grabbing #hmHead { cursor: grabbing; }
#hmFire { position: absolute; opacity: 0; pointer-events: none; -webkit-user-drag: none; transition: opacity .18s; }
#hmFire.on { opacity: 1; animation: hmFlicker .42s ease-in-out infinite alternate; }
@keyframes hmFlicker { from { opacity: .84; filter: brightness(1) drop-shadow(0 0 10px rgba(255,150,40,.8)); } to { opacity: 1; filter: brightness(1.2) drop-shadow(0 0 20px rgba(255,180,60,.95)); } }
/* --- hammer: hovers over the scene and drags, same feel as the bench hammer (wireHammer) --- */
#hmHammer { z-index: 4; transform-origin: 92.7% 59.5%;   /* butt of the handle — rotating here swings the HEAD */
    transform: translate(var(--hx,0px), var(--hy,0px)); filter: drop-shadow(0 26px 18px rgba(0,0,0,.5)); animation: hmHover 2.8s ease-in-out infinite; }
#hmHammer.dragging { animation: none; }
#hmHammer.striking { filter: drop-shadow(0 16px 12px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(255,200,90,.95)); }
#hmHammer.hit { filter: drop-shadow(0 10px 8px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(255,235,170,1));
    animation: hmSwing .24s cubic-bezier(.2,.8,.35,1) both; }
@keyframes hmHover { 0%,100% { transform: translate(var(--hx,0px), var(--hy,0px)); } 50% { transform: translate(var(--hx,0px), calc(var(--hy,0px) - 10px)); } }
/* impact, then a bounce back up, then settle. Negative angle drops the head; positive lifts it. */
@keyframes hmSwing {
    0%   { transform: translate(var(--hx,0px), var(--hy,0px)) rotate(0deg); }
    20%  { transform: translate(var(--hx,0px), var(--hy,0px)) rotate(-13deg); }
    52%  { transform: translate(var(--hx,0px), calc(var(--hy,0px) - 5px)) rotate(7deg); }
    100% { transform: translate(var(--hx,0px), var(--hy,0px)) rotate(0deg); }
}
#hmGrip { position: absolute; z-index: 5; left: 53%; top: 3%; width: 44%; height: 66%; pointer-events: auto; cursor: grab; touch-action: none; }
#hmGrip.dragging { cursor: grabbing; }
/* --- strike sparks --- */
#hmFx { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
#hmFx > * { position: absolute; pointer-events: none; }
/* the white core of the blow */
.hm-flash { width: 15%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,242,1), rgba(255,205,100,.7) 34%, rgba(255,140,40,0) 70%);
    animation: hmFlash .26s ease-out forwards; }
@keyframes hmFlash { 0% { transform: translate(-50%,-50%) scale(.22); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.55); opacity: 0; } }
/* the shock ring travelling out across the anvil face */
.hm-ring { width: 7%; aspect-ratio: 1; border: 3px solid rgba(255,218,145,.9); border-radius: 50%;
    animation: hmRing .40s cubic-bezier(.2,.75,.4,1) forwards; }
@keyframes hmRing { 0% { transform: translate(-50%,-50%) scale(.2); opacity: .95; border-width: 3px; }
                    100% { transform: translate(-50%,-50%) scale(3.6); opacity: 0; border-width: 1px; } }
/* sparks fly out along --sx/--sy, then gravity pulls them down by --sf on the way out */
.hm-spark { border-radius: 50%; animation: hmSpark var(--sd,.6s) cubic-bezier(.12,.62,.45,1) forwards; }
@keyframes hmSpark {
    0%   { transform: translate(-50%,-50%) translate(0,0) scale(1); opacity: 1; }
    55%  { transform: translate(-50%,-50%) translate(calc(var(--sx) * .64), var(--sy)) scale(.85); opacity: 1; }
    100% { transform: translate(-50%,-50%) translate(var(--sx), calc(var(--sy) + var(--sf))) scale(.2); opacity: 0; }
}
/* --- one line of guidance; NOT a heat readout --- */
.hm-hud { position: absolute; z-index: 9; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: linear-gradient(to top, rgba(10,7,4,.9), rgba(10,7,4,0)); font-size: 11px; color: #e7d3a8; }
.hm-hud .hm-title { font-family: 'Cinzel', serif; font-weight: 700; color: #ffd98a; }
.hm-hud .hm-tip { flex: 1; color: #bda887; }
.hm-hud .hm-tip b { color: #ffd98a; }

/* ---- wireframe / debug skeleton overlay (#frame.wire — via ?wire or the 'w' key) ---- */
#frame.wire #hud, #frame.wire #map-wrap, #frame.wire #bench, #frame.wire #rail { outline: 2px dashed rgba(80,220,255,0.85); outline-offset: -2px; }
#frame.wire .station, #frame.wire #pestle, #frame.wire #hammerTool, #frame.wire #dragon, #frame.wire #oreShelf, #frame.wire #bucketFront, #frame.wire #mug { outline: 1px solid rgba(255,120,180,0.95); }
#frame.wire .station::after, #frame.wire #pestle::after, #frame.wire #hammerTool::after, #frame.wire #dragon::after, #frame.wire #oreShelf::after, #frame.wire #mug::after {
    content: attr(id); position: absolute; left: 0; top: -12px; font-size: 8px; font-weight: bold; color: #ff9ecb; background: rgba(0,0,0,0.72); padding: 0 3px; border-radius: 3px; white-space: nowrap; z-index: 50; pointer-events: none; }

/* ---- clean render mode (#frame.clean — via ?clean): hide loop-test/tutorial chrome absent from the anchor marketing art (step badges, station captions, zoom buttons, hint bar, heat gauge). Gameplay untouched; visual-only. ---- */
#frame.clean .badge, #frame.clean .cap, #frame.clean .bucket-cap, #frame.clean .bellow-tag, #frame.clean .zoom, #frame.clean #sfHint, #frame.clean #heatMini, #frame.clean #sfHp, #frame.clean .map-tag { display: none !important; }

/* ===== right column (r20) - structured from the owner's UI reference:
   4 map-selection tabs overlapping the map edge, a day/gold/popularity box, SKILL TREE,
   and a MATERIALS inventory holding every ore. Palette stays the build's warm parchment/wood
   (the reference is a greyscale wireframe, so it drives structure + proportion, not colour). ===== */
#frame.landscape > #rail { display: flex; flex-direction: column; gap: 8px; padding: 12px 9px 42px;
    background: #1b120c url('assets/ui/rail_wood.png') center center / 100% 100% no-repeat; }
.railCard { background: linear-gradient(180deg,#efe1bc,#d6c396); border: 3px solid #241a0c; border-radius: 9px;
    box-shadow: 0 3px 7px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.35); }
#statPanel { flex: 0 0 auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.statRow { display: flex; gap: 6px; align-items: stretch; }
.dayTile { flex: 0 0 34%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #f7edd4; border: 2px solid #241a0c; border-radius: 5px; padding: 3px 0; }
.dayTile .n { font-family: 'Cinzel', serif; font-weight: 900; font-size: 21px; line-height: 1; color: #241a0c; }
.dayTile .l { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 1.5px; color: #4a381c; }
.statCol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; justify-content: center; }
.statPill { display: flex; align-items: center; gap: 5px; background: #f7edd4; border: 2px solid #241a0c; border-radius: 5px;
    padding: 3px 6px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; color: #241a0c; white-space: nowrap; }
.statPill .ic { font-size: 13px; }
#skillBtn { width: 100%; display: block; text-align: center; cursor: pointer; font-family: 'Cinzel', serif; font-weight: 900;
    font-size: 14px; letter-spacing: .6px; color: #f7edd4; background: linear-gradient(180deg,#6d5532,#493720);
    border: 2px solid #241a0c; border-radius: 5px; padding: 5px 0; box-shadow: inset 0 1px 0 rgba(255,220,150,.22); }
#skillBtn:active { transform: scale(.97); }
#matPanel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 7px; }
#matTabs { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; margin: -14px 0 7px; }
.matTab { height: 23px; background: linear-gradient(180deg,#4c3a21,#2c2013); border: 2px solid #241a0c;
    border-radius: 4px 4px 0 0; cursor: pointer; }
.matTab.is-on { background: linear-gradient(180deg,#7a5c28,#4c3a21); }
#xpRow { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
#xpRow .star { font-size: 16px; line-height: 1; color: #4a381c; }
.xpBar { flex: 1 1 auto; height: 10px; background: #b3a075; border: 2px solid #241a0c; border-radius: 6px; overflow: hidden; }
.xpFill { display: block; height: 100%; width: 45%; background: #f7edd4; }
.matHead { text-align: center; font-family: 'Cinzel', serif; font-weight: 700; font-size: 11px; letter-spacing: 1.6px;
    color: #241a0c; border-top: 2px solid #241a0c; border-bottom: 2px solid #241a0c; padding: 3px 0; margin-bottom: 7px; }
#frame.landscape #oreShelf { position: static; flex: 1 1 auto; min-height: 0; grid-template-columns: repeat(3,1fr);
    grid-auto-rows: minmax(0,1fr); gap: 5px; padding: 0; align-content: stretch; overflow: hidden; }
#frame.landscape .ore-slot { background: linear-gradient(180deg,#c4b189,#ab9770); border: 2px solid #241a0c;
    border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255,255,255,.28); padding: 4px 2px; }
#frame.landscape .ore-slot { justify-content: center; }
#frame.landscape .ore-slot img { width: auto; height: auto; max-width: 100%; max-height: 100%; min-height: 0; flex: 0 1 auto; }
#frame.landscape .ore-slot.empty { background: linear-gradient(180deg,#b6a37c,#9d8a64); }
.hazHot { opacity: 0; transition: opacity .12s linear; }          /* r27: red wash faded in while the sword is inside */
.haz.hot .hazHot { opacity: 0.5; }
.zoom button.on { background: rgba(150,90,25,0.9); border-color: #d8a94e; }   /* fog cheat active */   /* r26: sink the bright tan crack texture so hazards read dark against the parchment */
/* blade-trait panel (r21) - top-left, per the reference: 5 trait slots over cancel / save.
   A trait of tier N fills N slots with its icon, so the row doubles as the blade's capacity meter. */
#bladePanel { width: 156px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
#traitSlots { display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; }
.tslot { display: flex; align-items: center; justify-content: center; height: 34px; border-radius: 5px;
    background: #f7edd4; border: 2px solid #241a0c; font-size: 17px; line-height: 1; }
.tslot:not(.filled)::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #7c6a45; }
.bladeBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.bladeBtns button { height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 18px; color: #f7edd4; background: linear-gradient(180deg,#6d5532,#493720);
    border: 2px solid #241a0c; border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255,220,150,.22); }
.bladeBtns button:active { transform: scale(.96); }
/* 4 map-selection tabs - sit on the map's right edge, tucked against the column (reference) */
#mapTabs { position: absolute; z-index: 21; right: var(--rail-w); top: 2%; display: flex; flex-direction: column; gap: 3px; }
.mapTab { width: 43px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-family: 'Cinzel', serif; font-weight: 900; font-size: 16px; color: #f7edd4;
    background: linear-gradient(180deg,#6d5532,#493720); border: 2px solid #241a0c; border-radius: 6px 0 0 6px;
    box-shadow: 0 2px 5px rgba(0,0,0,.55); }
.mapTab.is-on { background: linear-gradient(180deg,#a8823f,#7a5c28); color: #fff8e0; }
.mapTab:active { transform: scale(.96); }
</style>

<body>
<div id="frame" class="landscape">

    <div id="hud">
        <div id="bladePanel" class="railCard">
            <div id="traitSlots" title="Traits on this blade — a tier-N trait fills N slots"></div>
            <div class="bladeBtns">
                <button id="cancelCraft" type="button" title="Cancel crafting — resets the sword">✕</button>
                <button id="saveBlade" type="button" title="Save (placeholder)">💾</button>
            </div>
        </div>
    </div>
    <div id="mapTabs" title="Map selection (placeholder)">
        <button class="mapTab is-on" type="button">1</button>
        <button class="mapTab" type="button">2</button>
        <button class="mapTab" type="button">3</button>
        <button class="mapTab" type="button">4</button>
    </div>

    <!-- ===== MAP (movement-puzzle board, copied from SwordforgeV2) ===== -->
    <div id="map-wrap">
        <span class="map-tag">🗺️ Ore-path map</span>
        <img id="compass" src="assets/map/compass.png" alt="">
        <div id="sfHp" title="Blade integrity — hazard zones damage the active sword"><span class="lbl">⚔</span><span class="bar"><span class="fill"></span></span></div>

<script>
// ============================================================
//  MAP  — ported from SwordforgeV2 (vector-path board + fog)
// ============================================================
const NS = 'http://www.w3.org/2000/svg';

// ============================================================
//  LAYOUT SKELETON — data-driven placement (Phase 0)
//  Every prop is positioned as FRACTIONS of the bench zone. Two orientation
//  variants; applyLayout() writes them to the DOM as percentages (so they
//  auto-reflow on resize). To MOVE a prop, edit one number here — nothing else.
//  Recorded ground truth + invariants: specs/2026-08-13-looptest-layout-skeleton.md
// ============================================================
const LAYOUT = {
    portrait: {   // Phase 1 anchor composition (loop r3: anchor-cut props packed with edge bleeds per the Opus art director). bench = left column (rail excluded).
        stSmelt:    {x:0.15, y:-0.02, w:0.51},  // furnace, nudged further left + ~10% bigger
        stMortar:   {x:0.60, y:0.14,  w:0.30},  // mortar, top-right (full bowl + legs visible, touches furnace)
        pestle:     {x:0.66, y:0.06,  w:0.13},  // plunged into the mortar bowl (CSS ~50deg)
        hammerTool: {x:0.28, y:0.46,  w:0.17},  // hero hammer across the anvil face
        stAnvil:    {x:0.13, y:0.48,  w:0.40},  // anvil, large left mass (lifted to close the mid band)
        bucket:     {x:0.63, y:0.53,  w:0.27},  // water bucket, dense bottom-right cluster
        mug:        {x:0.70, y:0.52,  w:0.17},  // copper mug, tipped over the bucket rim (CSS rotate)
        dragon:     {x:-0.01,y:0.42,  w:0.17}   // dragon whelp, bleeds off the left, overlaps anvil flank
    },
    landscape: {   // r13: sizes + positions matched to assets/Anchor-images/landscape-scale-ref.png. bench = wide bottom band (rail excluded). x,y,w = fractions of bench.
        stSmelt:    {x:0.539, y:-0.816, w:0.24}, // r13: furnace scaled to the ref 0.190 of frame width (was 1.44x too big); bleeds up over the map, base on the floor
        stMortar:   {x:0.795, y:-0.289, w:0.23}, // r15: grinder -30% (owner); grounded
        pestle:     {x:0.837, y:0.300, w:0.053}, // vestigial (hidden in landscape) - kept in-zone for parity
        hammerTool: {x:0.247, y:0.449, w:0.165}, // r15: hammer +75% (owner); anchored by its box top
        stAnvil:    {x:0.187, y:-0.249, w:0.191}, // r15: anvil -20% (owner); grounded
        bucket:     {x:0.019, y:0.041, w:0.171}, // r13: bucket was already on-scale (0.97x); x/y re-grounded to the new floor line
        mug:        {x:0.054, y:-0.025, w:0.11}, // r14: mug 2x (owner); scaled about its centre so it stays seated in the bucket
        dragon:     {x:0.081, y:-0.989, w:0.228} // r14: dragon 1.5x (owner); grounded, rises further over the map
    }
};
// one LAYOUT key can drive several DOM ids (the bucket is three stacked layers sharing one box)
const PROP_ELS = { bucket:['bucketBack','bucketFront'] };   // mug has its own LAYOUT key now (anchor art: bucket + mug are separate cuts)
function propIds(name){ return PROP_ELS[name] || [name]; }
let SF_ORIENT = 'portrait';
// pure: fraction entry + zone dims -> pixel box. No clamping — the self-test guards in-zone.
function resolveLayout(name, orient, zoneW, zoneH){ const e=LAYOUT[orient] && LAYOUT[orient][name]; if(!e) return {x:0,y:0,w:0}; return { x:e.x*zoneW, y:e.y*zoneH, w:e.w*zoneW }; }
// write every prop's position as a PERCENT of the bench zone
function applyLayout(orient){ orient=orient||SF_ORIENT; const L=LAYOUT[orient]; if(!L) return; for(const name in L){ const e=L[name]; propIds(name).forEach(id=>{ const el=document.getElementById(id); if(!el) return; el.style.left=(e.x*100).toFixed(3)+'%'; el.style.top=(e.y*100).toFixed(3)+'%'; el.style.width=(e.w*100).toFixed(3)+'%'; el.style.right='auto'; }); } }
function setOrientation(orient){ SF_ORIENT=orient; const f=document.getElementById('frame'); if(f) f.classList.toggle('landscape', orient==='landscape'); applyLayout(orient); }
// snap the movable mug back into the bucket, straight from LAYOUT (orientation-aware, no captured px)
function homeMug(){ const e=LAYOUT[SF_ORIENT]&&LAYOUT[SF_ORIENT].mug, mug=document.getElementById('mug'); if(!e||!mug) return; mug.style.left=(e.x*100).toFixed(3)+'%'; mug.style.top=(e.y*100).toFixed(3)+'%'; mug.style.width=(e.w*100).toFixed(3)+'%'; mug.style.right='auto'; }
// bench-relative constants (scale-independent) — read from the live bench box
function benchDims(){ const b=document.getElementById('bench'); return b?{w:b.clientWidth,h:b.clientHeight}:{w:568,h:641}; }
function strikeDist(){ return benchDims().w*0.116; }   // was 66px @ bench width 568
// ---- wireframe / debug overlay (?wire, or press 'w') — draw the skeleton, no art needed ----
function toggleWireframe(on){ const f=document.getElementById('frame'); if(!f) return; if(on===undefined) f.classList.toggle('wire'); else f.classList.toggle('wire', !!on); }

// The ores, each with its own unique vector path radiating from START.
// First 4 go UP (left/right, single gentle curve); last 4 go DOWN with curvier S / C shaped paths (placeholder icons).
const ORES = [
    // r29: the owner's 7 metals, traced from the per-ore path cards. Each 'd' runs POTION -> MORTAR:
    // the potion is the path ORIGIN (the sword's current position), and the mortar is where a fully
    // ground ore ends up. The card's X mark is the RAW-ore stop, which falls out of the existing
    // tPct = 0.5 + 0.5*grind — so the X is the 50%-of-arc-length point and needs no data of its own.
    // 'len' is the target arc length in world units; normalizeOrePaths() rescales each 'd' to hit it,
    // so the shapes can be drawn freely without hand-computing scale.
    // Art: manganese/nickel/tin/zinc reuse the retiring elementals' PNGs (owner's choice) — the picture
    // does not match the metal, it is a stand-in until real ore art exists.
    { id:'iron',      name:'Iron',      color:'#8a5a33', img:'assets/forge/iron_ore.png',      len:200, d:'M0,0 C -8,-12 -17,-18 -25,-17.5 C -33,-17 -42,-6 -49,1 C -56,-6 -65,-17 -74,-17.5 C -82,-18 -91,-12 -98,0' },   // r29b: upside-down W. From the potion (origin, right) heading W: up, down to the X, up, down to the mortar. Amplitude/run = 0.18, matching the card.
    { id:'manganese', name:'Manganese', color:'#6f6a72', img:'assets/forge/gale_ore.png',      len:258, d:'M0,0 C -22,-32 -52,-42 -62,-16 C -70,4 -48,14 -36,-2 C -26,-18 -62,-32 -100,-10' },
    { id:'copper',    name:'Copper',    color:'#c8763c', img:'assets/forge/copper_ore.png',    len:225, d:'M0,0 C -10,-16 -18,-28 -22,-36 C -27,-40 -32,-37 -37,-36 C -47,-34 -56,-32 -55,-42 C -54,-54 -60,-62 -71,-73' },   // r29c: wavy S. Climbs NW off the potion, flattens through the X, waves left, then turns north to the mortar.
    { id:'aluminium', name:'Aluminium', color:'#b9c2c9', img:'assets/forge/aluminium_ore.png', len:250, d:'M0,0 C -2,-22 -10,-46 -26,-62 C -36,-71 -44,-73 -50,-70 C -42,-60 -30,-45 -20,-34' },   // r29d: fishhook. Long arc up-left off the potion past the X, then doubles BACK down-right to the mortar, which sits mid-card. Doubling back means short reach for a long path.
    { id:'nickel',    name:'Nickel',    color:'#cfd3cf', img:'assets/forge/frost_ore.png',     len:215, d:'M0,0 C 14,-9 28,-16 33,-27 C 37,-36 29,-38 26,-44 C 22,-54 20,-58 21,-64 C 23,-72 34,-79 53,-90' },   // r29e: S-curve heading NE. Bulges right off the potion, swings back left through the X, then right again to the mortar. Was heading due N.
    { id:'tin',       name:'Tin',       color:'#9aa3a8', img:'assets/forge/gold_ore.png',      len:185,
      d:'M0,0 C 15,-17 33,-17 47,-1 C 61,15 79,15 93,-1 C 101,-10 110,-14 120,-15' },
    { id:'zinc',      name:'Zinc',      color:'#8fa2ad', img:'assets/forge/tide_ore.png',      len:230,
      d:'M0,0 C 27,18 35,44 21,64 C 4,88 -34,94 -40,114 C -45,131 -24,141 -6,144' }
];
const ORE_BY = {}; ORES.forEach(o => ORE_BY[o.id] = o);
// r29: rescale every ore path so its arc length equals its declared 'len'. Uniform scaling of the
// coordinates scales arc length by the same factor, so measure once and apply k = target/actual.
function normalizeOrePaths(){
    if(!board) return;
    const t=document.createElementNS(NS,'path'); t.setAttribute('fill','none'); t.style.display='none'; board.appendChild(t);
    ORES.forEach(o=>{ if(!o.len || o._norm) return;
        t.setAttribute('d',o.d); const L=t.getTotalLength(); if(!L) return;
        const k=o.len/L;
        o.d=o.d.replace(/-?\d+(\.\d+)?/g, n=>{ const v=parseFloat(n)*k; return (Math.round(v*100)/100).toString(); });
        o._norm=true; });
    board.removeChild(t);
}
ORES.forEach(o => { if(!o.img) o.img = orePlaceholder(o.color); });   // ores without art get a generated placeholder gem icon
function oreImg(id){ return (ORE_BY[id] && ORE_BY[id].img) || ('assets/forge/'+id+'_ore.png'); }
function orePlaceholder(color){ return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><radialGradient id="g" cx="38%" cy="30%" r="75%"><stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/><stop offset="45%" stop-color="'+color+'"/><stop offset="100%" stop-color="#1a1209"/></radialGradient></defs><path d="M9 21 L19 8 L34 10 L42 25 L34 40 L15 38 Z" fill="url(#g)" stroke="#241a10" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 8 L24 22 L42 25" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.6"/></svg>'); }
// each ore path ends at a signature trait (the 4 new ores map to 4 formerly-scattered traits)
const ORE_TRAIT = { iron:'durable', manganese:'heavy', copper:'swift', aluminium:'flexible', nickel:'balanced', tin:'grace', zinc:'water' };   // r17: NO LONGER DRIVES TRAIT PLACEMENT (positions come from TRAIT_POS). Kept only so the ore->signature-trait idea survives the pending ore rework; sharp/flame/storm were repointed to swift/fire/gale so nothing dangles. NOTE the 'gale' ore and 'gale' trait now share a name.

const TRAITS = [   // r17: catalog redrawn from the owner's trait-map sketch (25 traits).
    // centre ring (inside the opening reveal)
    { id:'swift', name:'Swift', symbol:'🪶' }, { id:'balanced', name:'Balanced', symbol:'⚖️' }, { id:'durable', name:'Durable', symbol:'🛡️' },
    { id:'flexible', name:'Flexible', symbol:'〰️' }, { id:'heavy', name:'Heavy', symbol:'⚓' },
    // outer field (in the fog)
    { id:'celestial', name:'Celestial', symbol:'☄️' }, { id:'cloud', name:'Cloud', symbol:'☁️' }, { id:'rainbow', name:'Rainbow', symbol:'🌈' },
    { id:'luck', name:'Luck', symbol:'🍀' }, { id:'lightning', name:'Lightning', symbol:'⚡' }, { id:'noble', name:'Noble', symbol:'👑' },
    { id:'grace', name:'Grace', symbol:'✨' }, { id:'gale', name:'Gale', symbol:'🌪️' }, { id:'floral', name:'Floral', symbol:'🌸' },
    { id:'fury', name:'Fury', symbol:'💢' }, { id:'ice', name:'Ice', symbol:'❄️' }, { id:'fire', name:'Fire', symbol:'🔥' },
    { id:'water', name:'Water', symbol:'💧' }, { id:'magma', name:'Magma', symbol:'🌋' }, { id:'mist', name:'Mist', symbol:'🌫️' },
    { id:'poison', name:'Poison', symbol:'🧪' }, { id:'savage', name:'Savage', symbol:'🐅' }, { id:'blood', name:'Blood', symbol:'🩸' },

// ---- organic hazard blobs (r26) ----------------------------------------------------------------
// Radius varies with angle as a sum of sine harmonics. The harmonics are INTEGER multiples of theta,
// so the curve is periodic by construction and closes at 2pi with no seam — the usual failure mode
// when radii are jittered randomly. Phases come from the seeded rnd(), so the map stays deterministic.
// r28: the Potion Craft field is a MIX of scales — long snaking ribbons, shorter fat arcs, compact
// islands and tiny specks — not one uniform size. Each kind gets its own step, length, width and count.
const HAZ_KINDS=[
    { kind:'ribbon', n:16, segs:[10,18], w:[32,54], step:66, chunks:3, major:true,  sm:false },
    { kind:'arc',    n:20, segs:[4,8],   w:[34,52], step:60, chunks:2, major:true,  sm:false },
    { kind:'island', n:26, segs:[1,2],   w:[26,44], step:26, chunks:1, major:false, blob:true },
    { kind:'speck',  n:30, segs:[1,1],   w:[16,26], step:8,  chunks:1, major:false, blob:true }
];
// Corridors: keep a real lane between the BIG masses; small stuff may sit closer since it is trivially
// routed around. Major gap stays >= a single ore hop (reaches run 165-256).
const CORRIDOR_MAJOR=70, CORRIDOR_MINOR=30;   // r28b: tightened for reference density. The sword is a point, so a 90u lane (~67px on screen) is comfortably threadable against ore reaches of 165-256.
// A ribbon is a wandering SPINE, stroked thick. The walk carries momentum on its TURN RATE (not just
// its heading) and damps it, so the path curves smoothly and meanders instead of zigzagging.
function hazardSpine(x0,y0,segs,step){
    const pts=[{x:x0,y:y0}]; let ang=rnd()*6.2832, turn=0;
    for(let i=0;i<segs;i++){
        turn = turn*0.78 + (rnd()-0.5)*0.62;
        ang += turn;
        const p=pts[pts.length-1];
        pts.push({x:p.x+Math.cos(ang)*step, y:p.y+Math.sin(ang)*step});
    }
    return pts;
}
// SVG stroke-width is constant per path, so a ribbon that thickens and thins is drawn as a few
// overlapping chunks at different widths. Chunks SHARE an endpoint and use round caps, so they blend
// into one mass rather than showing seams.
function chunkSpine(pts,nChunks,wBase){
    if(nChunks<=1 || pts.length<4) return [{pts:pts, w:wBase}];
    const parts=[], per=Math.ceil((pts.length-1)/nChunks);
    for(let c=0;c<nChunks;c++){ const a=c*per, b=Math.min(pts.length-1, a+per); if(b<=a) break;
        parts.push({pts:pts.slice(a,b+1), w:wBase*(0.72+rnd()*0.62)}); }
    return parts;
}
function hazardBlob(cx,cy,rr){
    const ph=[rnd()*6.2832, rnd()*6.2832, rnd()*6.2832], pts=[];
    for(let i=0;i<18;i++){ const t=i/18*6.2832;
        const k=1 + 0.16*Math.sin(2*t+ph[0]) + 0.11*Math.sin(3*t+ph[1]) + 0.07*Math.sin(5*t+ph[2]);
        pts.push({x:cx+Math.cos(t)*rr*k, y:cy+Math.sin(t)*rr*k}); }
    return pts;
}
function blobPath(pts){ const n=pts.length; let d='';
    for(let i=0;i<n;i++){ const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
        if(i===0) d+='M'+p1.x.toFixed(1)+','+p1.y.toFixed(1);
        d+='C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+','+(p1.y+(p2.y-p0.y)/6).toFixed(1)
          +' '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+','+(p2.y-(p3.y-p1.y)/6).toFixed(1)
          +' '+p2.x.toFixed(1)+','+p2.y.toFixed(1); }
    return d+'Z';
}
function inBlob(px,py,pts){ let inside=false;
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
        if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside; }
    return inside;
}
function ring(pts){ return pts.concat([pts[0]]); }   // closed polyline, for distance queries
function partsBBox(parts,pad){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    parts.forEach(pt=>pt.pts.forEach(p=>{ const w=(pt.poly?0:pt.w)+pad;
        if(p.x-w<x0)x0=p.x-w; if(p.x+w>x1)x1=p.x+w; if(p.y-w<y0)y0=p.y-w; if(p.y+w>y1)y1=p.y+w; }));
    return [x0,y0,x1,y1];
}
function partsHit(px,py,parts){ for(const pt of parts){
    if(pt.poly ? inBlob(px,py,pt.pts) : distToSpine(px,py,pt.pts)<=pt.w) return true; } return false; }
function partsClear(px,py,parts){ let best=1e9;
    for(const pt of parts){ const d = pt.poly
        ? (inBlob(px,py,pt.pts) ? -distToSpine(px,py,ring(pt.pts)) : distToSpine(px,py,ring(pt.pts)))
        : distToSpine(px,py,pt.pts)-pt.w;
      if(d<best) best=d; }
    return best; }
// smooth curve through the spine points (same Catmull-Rom -> Bezier as the trait blobs, open not closed)
function spinePath(pts){ const n=pts.length; let d='M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
    for(let i=0;i<n-1;i++){ const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(n-1,i+2)];
        d+='C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+','+(p1.y+(p2.y-p0.y)/6).toFixed(1)
          +' '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+','+(p2.y-(p3.y-p1.y)/6).toFixed(1)
          +' '+p2.x.toFixed(1)+','+p2.y.toFixed(1); }
    return d;
}
// shortest distance from a point to the spine polyline — the collision test, cheaper than point-in-polygon
function distToSpine(px,py,pts){ let best=1e9;
    for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1];
        const vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
        let t = L ? ((px-a.x)*vx+(py-a.y)*vy)/L : 0; t = t<0?0:(t>1?1:t);
        const d=Math.hypot(px-(a.x+vx*t), py-(a.y+vy*t)); if(d<best) best=d; }
    return best;
}
function spineBBox(pts,pad){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    pts.forEach(p=>{ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; });
    return [x0-pad,y0-pad,x1+pad,y1+pad];
}

    fogHoles.innerHTML=''; revLast={}; marker={x:START.x,y:START.y}; setSword(START.x,START.y);

    // (no signature-trait pre-reveal — traits stay fogged until the sword's travel clears fog over them; identity stays '?' until acquired)

//  MOVABLE PROPS — pestle + dragon are draggable (placement preview)
// ============================================================
// r22: drag bounds = the whole FRAME, not the bench band. Props live inside #bench (overflow:visible),
// so the frame box is translated into bench-local coords. Without this a prop stops a few px above the
// bench top, which since r16 is ~75% of the way DOWN the screen.
function dragBox(el, b, bleed){ bleed=(bleed==null)?20:bleed;
    const fr=document.getElementById('frame').getBoundingClientRect();
    return { x0: fr.left-b.left-bleed,  x1: fr.right-b.left-el.offsetWidth+bleed,
             y0: fr.top-b.top-bleed,    y1: fr.bottom-b.top-el.offsetHeight+bleed }; }
function makeDraggable(el){
    if(!el) return;
    let drag=false, dx=0, dy=0;
    el.addEventListener('pointerdown', e=>{ drag=true; el.classList.add('dragging'); const r=el.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; try{ el.setPointerCapture(e.pointerId); }catch(err){} });
    el.addEventListener('pointermove', e=>{ if(!drag) return; const b=el.parentElement.getBoundingClientRect(); let x=e.clientX-b.left-dx, y=e.clientY-b.top-dy; const q=dragBox(el,b,30); x=Math.max(q.x0, Math.min(q.x1, x)); y=Math.max(q.y0, Math.min(q.y1, y)); el.style.left=x+'px'; el.style.top=y+'px'; el.style.right='auto'; });
    const end=()=>{ drag=false; el.classList.remove('dragging'); }; el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function wireMovable(){ makeDraggable(document.getElementById('pestle')); makeDraggable(document.getElementById('dragon')); }

// Hammer: draggable, and when its head nears the anvil top it rotates & strikes (with a spark).
function wireHammer(){
    const h=document.getElementById('hammerTool'), anvil=document.getElementById('stAnvil'),
          spark=document.getElementById('hammerSpark'), bench=document.getElementById('bench');
    if(!h||!anvil||!bench) return;
    function strikePoint(){ const br=bench.getBoundingClientRect(), ar=anvil.getBoundingClientRect(); return { x:ar.left+ar.width*0.50-br.left, y:ar.top+ar.height*0.16-br.top }; }  // anvil top face
    function check(){
        const STRIKE_DIST=strikeDist();   // recompute each check so it tracks the live bench width (survives reflow / orientation swap / resize)
        const br=bench.getBoundingClientRect(), hr=h.getBoundingClientRect();
        const hx=hr.left+hr.width/2-br.left, hy=hr.top+hr.height/2-br.top, sp=strikePoint();
        const near=Math.hypot(hx-sp.x, hy-sp.y) < STRIKE_DIST;
        h.classList.toggle('striking', near);
        if(near){ spark.style.left=sp.x+'px'; spark.style.top=sp.y+'px'; spark.classList.add('on'); }
        else spark.classList.remove('on');
    }
    let drag=false, dx=0, dy=0;
    h.addEventListener('pointerdown', e=>{ drag=true; h.classList.add('dragging'); const r=h.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; try{ h.setPointerCapture(e.pointerId); }catch(err){} });
    h.addEventListener('pointermove', e=>{ if(!drag) return; const b=bench.getBoundingClientRect(); let x=e.clientX-b.left-dx, y=e.clientY-b.top-dy-dragLift(e); const q=dragBox(h,b,20); x=Math.max(q.x0, Math.min(q.x1, x)); y=Math.max(q.y0, Math.min(q.y1, y)); h.style.left=x+'px'; h.style.top=y+'px'; check(); });
    const end=()=>{ drag=false; check(); }; h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
}

// --- stacked route geometry (each ore = one segment continuing from the last ✕) ---
function segPointLocal(seg,frac){ measure.setAttribute('d',seg.d); const p=measure.getPointAtLength(Math.max(0,Math.min(1,frac))*seg.len); return {x:seg.origin.x+p.x, y:seg.origin.y+p.y}; }
function segPoint(seg,frac){ const l=segPointLocal(seg,frac); return {x:l.x+pull.x, y:l.y+pull.y}; }   // rendered = local + dragon pull

function routeEnd(){ const l=routeEndLocal(); return {x:l.x+pull.x, y:l.y+pull.y}; }
function addSegment(oreId,grind){ const d=ORE_BY[oreId].d; measure.setAttribute('d',d); const len=measure.getTotalLength(); const o=routeEndLocal(); segs.push({ore:oreId,d:d,len:len,origin:{x:o.x,y:o.y},tPct:0.5+0.5*grind}); drawRoute(); moveX(); }
function drawRoute(fromSword){ if(fromSword===undefined) fromSword=true; if(!segs.length){ pathEl.style.display='none'; return; }   // fromSword: draw only the REMAINING route (sword→✕) so the traveled part is erased; false = whole route
    const ss=fromSword?sword.seg:0, sf=fromSword?sword.frac:0; let d='',first=true;
    for(let si=ss; si<segs.length; si++){ const s=segs[si], from=(si===ss)?sf:0, to=s.tPct; if(to<=from+0.0001) continue; const steps=Math.max(2,Math.round(s.len*(to-from)/10)); for(let i=0;i<=steps;i++){ const frac=from+(to-from)*i/steps; const p=segPoint(s,frac); d+=(first?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)+' '; first=false; } }
    if(first){ pathEl.style.display='none'; return; }   // sword reached the end → nothing left to draw
    pathEl.setAttribute('d',d); pathEl.removeAttribute('stroke-dasharray'); pathEl.removeAttribute('transform'); pathEl.style.display=''; }

// preview shows the ore's FULL potential path from the current ✕: SOLID 0→solidPct, DOTTED solidPct→1.0, with the ✕ sitting at the boundary. solidPct starts at 0.5 (raw ore) and grows to 1.0 as you grind — so the solid part & ✕ advance together, the dotted tail shrinks. All rendered above the fog (no reveal), so the map stays hidden until the sword actually travels.
function drawSegmentPreview(oreId,solidPct){ const o=routeEnd(); const d=ORE_BY[oreId].d; measure.setAttribute('d',d); const len=measure.getTotalLength(); solidPct=Math.max(0,Math.min(1,solidPct));
    let sd='',ss=Math.max(2,Math.round(len*solidPct/10)); for(let i=0;i<=ss;i++){ const lp=measure.getPointAtLength(solidPct*i/ss*len); sd+=(i?'L':'M')+(o.x+lp.x).toFixed(1)+','+(o.y+lp.y).toFixed(1)+' '; } previewSolidEl.setAttribute('d',sd); previewSolidEl.removeAttribute('transform'); previewSolidEl.style.display= solidPct>0.002?'':'none';
    if(solidPct<0.998){ let dd='',ds=Math.max(2,Math.round(len*(1-solidPct)/10)); for(let i=0;i<=ds;i++){ const frac=solidPct+(1-solidPct)*i/ds; const lp=measure.getPointAtLength(frac*len); dd+=(i?'L':'M')+(o.x+lp.x).toFixed(1)+','+(o.y+lp.y).toFixed(1)+' '; } previewEl.setAttribute('d',dd); previewEl.removeAttribute('transform'); previewEl.style.display=''; }
    else previewEl.style.display='none';
    const bp=measure.getPointAtLength(solidPct*len); xmark.setAttribute('transform','translate('+(o.x+bp.x)+','+(o.y+bp.y)+')'); xmark.style.display=''; }

function drawPrepPreview(){ if(!prep){ hidePreviewPaths(); if(segs.length) moveX(); else xmark.style.display='none'; return; } drawSegmentPreview(prep.ore, 0.5+0.5*prep.grind); }

function startPrep(oreId){ prep={ore:oreId,grind:0}; oreImgEl.src=oreImg(oreId); orbEl.classList.remove('hot'); orbEl.style.display='block'; updateOrbLook(); placeOrbInMortar(); drawPrepPreview(); hint('<b>Hold the wheel</b> to grind this ore (extends its path), or drag it to the <b>furnace</b>.'); }

function tierFromDist(d){ return d<=ALIGN_EPIC?'Epic':(d<=ALIGN_FINE?'Fine':'Weak'); }
function tierColor(t){ return t==='Epic'?'#ffcf3a':(t==='Fine'?'#49b6ff':'#c0a48a'); }

function updateHpPill(){ const el=document.getElementById('sfHp'); if(!el) return;
    if(!melt || !swordOut()){ el.style.display='none'; return; }
    const pct=Math.max(0, Math.min(100, (melt.hp/BLADE_HP_MAX)*100)), f=el.querySelector('.fill');
    el.style.display='flex'; if(f){ f.style.width=pct.toFixed(1)+'%'; f.style.background = pct>60?'#5fd35f':(pct>30?'#e8b13a':'#e2503c'); } }
function clearHazardFx(){ hazards.forEach(h=>{ if(h.el) h.el.classList.remove('hot'); }); if(swordEl) swordEl.classList.remove('hurt'); }
// r16: hazards are real. Travelling through one drains blade integrity; at 0 the blade shatters and the run (with its
// acquired traits) is lost. Damage is applied only while the sword MOVES through a hazard — parking is safe, so furnace
// work never kills you passively.
function checkHazard(p,dt){ if(!melt || !dt) return;
    let inside=null; for(const h of hazards){ const b=h.bb;   // r28: bbox reject, then per-chunk distance
        if(p.x<b[0]||p.x>b[2]||p.y<b[1]||p.y>b[3]) continue;
        if(partsHit(p.x,p.y,h.parts)){ inside=h; break; } }
    hazards.forEach(h=>{ if(h.el) h.el.classList.toggle('hot', h===inside); });
    if(swordEl) swordEl.classList.toggle('hurt', !!inside);
    if(!inside) return;
    melt.hp=Math.max(0, melt.hp-HAZARD_DPS*dt); updateHpPill();

    else if(!melt._hazHint){ melt._hazHint=1; hint('⚠️ The sword is in a <b style="color:#e2503c">hazard zone</b> — it is losing integrity. Hammer on through or pull it clear with the dragon.'); } }
function shatterBlade(){ const n=(melt&&melt.traits)?melt.traits.length:0;
    clearHazardFx(); resetRun();
    hint('💥 The blade <b style="color:#e2503c">shattered</b> in a hazard zone'+(n?' — '+n+' acquired trait'+(n>1?'s':'')+' lost':'')+'. Grind an ore to start a new blade.'); }

        hint('On '+idLabel+' — alignment <b style="color:'+tierColor(tier)+'">'+tier+'</b>. Nudge with the dragon for a tighter fit, then <b>pour the mug</b> to '+(best.discovered?'lock it in':'acquire &amp; reveal it')+'.');

const TIER_PIPS={ Weak:1, Fine:2, Epic:3 };   // r21: a tier-N trait shows its icon N times (owner: "3 fire icons for a tier 3 fire")
const BLADE_SLOTS=5;
function bladePips(){ const out=[]; if(melt&&melt.traits) melt.traits.forEach(a=>{ const n=TIER_PIPS[a.tier]||1; for(let i=0;i<n;i++) out.push(a); }); return out; }

function openShapeSelect(){ document.getElementById('sfShapeModal').classList.add('show'); }
// ============================================================
//  r31 — HAMMER SCENE + forge loop.
//  Heat the metal with the dragon's fire, strike it while it glows, and it creeps toward the next
//  shape. Metal cools on its own, so heat has to be topped up between bursts of hammering.
//  Deliberately NO heat meter: the glow, the colour shift and the sparks are the entire readout.
// ============================================================
// Placement. Every number is a PERCENT — of the stage, or (for the dragon's own features) of the
// dragon sprite, which fills the stage 1:1. Nothing is in pixels, so the rig survives any frame size.
const HM_RIG = {
    anvil:  { x:50.1, y:53.5 },            // anvil top face, centre — where the metal sits
    oreW:   15, roughW: 77, roughRot: 26,  // stage widths; roughW puts the rough blade at the same
                                           // 57%-of-stage length as the finished sword's blade proper,
                                           // and roughRot lays it on that sword's -17deg axis
    pivot:  { x:6.1,  y:-26.4 },           // the dragon's fixed hinge, in stage space (above the top edge)
    tail:   { x:61.3, y:7.3 },             // the point ON THE SPRITE pinned to that hinge (base of the tail fin)
    snout:  { x:50.9, y:83.4 },            // sprite-space snout — where the fire leaves the head
    scale:  0.85, base: -45, swing: 34,    // rest pose, and how far the head may sweep either way
    fireW:  34,  fireRot: 70               // flame width (% of sprite) and its aim in the dragon's local frame
};
// The loop's numbers, all on a 0..1 heat scale.
const HM_FORGE = {
    heatGain:   0.80,   // heat/sec while the flame is actually ON the metal
    heatCool:   0.07,   // heat/sec lost, always — this is what forces you back to the dragon.
                        // r31c: halved from 0.15, which emptied full heat in 6.7s (4.3s to unworkable)
                        // and left no room to reposition. Now 14.3s / 9.3s.
    workMin:    0.35,   // below this the metal is too cold to move
    strikeBite: 0.09,   // heat a landed strike costs
    strikeGain: 0.14,   // shape progress a landed strike buys (1.0 = one whole stage, so ~7 strikes)
    reach:      0.46,   // the flame carries this fraction of the stage width
    cone:       34,     // degrees off the flame's axis that still count as on-target
    strikeGap:  170     // ms between strikes, so one fast sweep is not ten hits
};
let hmShape='Longsword', hmAngle=HM_RIG.base;
let hmHeat=0, hmProg=0;                    // 0..1 heat, 0..2 shape progress (sphere -> rough -> finished)
let hmRaf=null, hmLast=0, hmLastStrike=0;
function hmClear(){ hmBreath(false); hmStop(); }

function hmAimDragon(a){
    const R=HM_RIG, d=document.getElementById('hmDragon'); if(!d) return;
    hmAngle=Math.max(R.base-R.swing, Math.min(R.base+R.swing, a));
